[package]
name = "roundtable-web"
description = "Standalone Roundtable: a local web interface (chat-channel style) and the participant tools endpoint, over the roundtable core."
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "roundtable"
path = "src/main.rs"

[dependencies]
acp-host = { path = "../acp-host" }
anyhow.workspace = true
axum = "0.8"
bus = { path = "../bus" }
futures.workspace = true
reqwest.workspace = true
roundtable = { path = "../roundtable" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
