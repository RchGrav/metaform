[package]
name = "roundtable"
description = "Roundtable core: turn-based, judged collaboration among ACP agents. Host-agnostic library."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol = { version = "=5.0.0", features = ["stdio"] }
acp-host = { path = "../acp-host" }
agent-monitor = { path = "../agent-monitor" }
anyhow.workspace = true
bus = { path = "../bus" }
futures.workspace = true
getrandom = "0.4"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-segmentation = "1"

[dev-dependencies]
axum = "0.8"
tokio = { workspace = true, features = ["test-util"] }
