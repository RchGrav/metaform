name: Validate bootstrap contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: boat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: metaform/requirements-dev.txt
      - run: python -m pip install -r metaform/requirements-dev.txt
      - run: python metaform/tests/check_contract.py
      - run: python metaform/tests/check_tool_input.py
      - run: python tools/verify_bootstrap.py
