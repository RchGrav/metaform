[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metaform"
version = "2026.9.30.2"
description = "Functional maps that give agents a project's purpose before they work on it."
requires-python = ">=3.11"
# The chassis's list plus every shipped module's DEPENDENCIES, written by hatch_build.py, BASE-022 and BASE-041.
dynamic = ["dependencies"]

[project.scripts]
metaform = "metaform.cli:main"

[project.optional-dependencies]
# The checkers and the browser driver are pinned, so CI is repeatable.
dev = ["pytest>=8", "pytest-xdist>=3.8", "pytest-timeout==2.4.0", "pyright==1.1.414", "ruff==0.16.9",
       "playwright==1.63.0"]
# The voice module's local server engine, faster-whisper (CTranslate2), CPU int8 everywhere; voice-gpu adds NVIDIA's
# cuBLAS and cuDNN wheels for CUDA on Linux and Windows. Optional: the page's in-browser engine needs neither.
voice = ["faster-whisper>=1.2,<2"]
voice-gpu = ["faster-whisper>=1.2,<2", "nvidia-cublas-cu12>=12.4,<13; sys_platform == 'linux' or sys_platform == 'win32'",
             "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'linux' or sys_platform == 'win32'"]

[tool.metaform]
# The chassis's own dependencies, pure Python, BASE-026, except ladybug, the database engine of the project map: it
# ships ready-built for Linux, macOS and Windows on Python 3.10 to 3.14, so installing it compiles nothing. Copied into
# metaform/_build_info.py, BASE-041.
chassis-dependencies = ["prompt_toolkit>=3.0", "networkx>=3.3", "grand-cypher>=0.12", "PyYAML>=6.0",
                        "ladybug>=0.22.3,<0.23"]

[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/metaform"]

[tool.uv]
# The dependencies are dynamic, so a changed module declaration must refresh the environment too.
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { file = "src/metaform/modules/*/__init__.py" }, { file = "src/metaform/modules/*/manifest.py" }]

[tool.pytest.ini_options]
testpaths = ["tests", "src/metaform/modules"]
addopts = "-n auto --dist loadgroup -m \"not browser\""  # every core, browser tests grouped, conftest.py; half an hour on one core
# A hung test fails in five minutes with its stack, instead of holding the run to CI's job limit; the browser tests and
# the few that install for real carry a longer limit of their own. pytest-timeout picks the method: a signal where
# there is one, so the test's teardown still runs, and on Windows a thread that prints every thread's stack.
timeout = 300
markers = [
    "req(id): the spec requirement a test protects, QUAL-009 and E4",
    "kind(kind): fixture, simulation or real, QUAL-014",
    "browser: drives the page in a browser; left out of the default run, run with pytest -m browser",
    "cli_process: each CLI call the test makes runs as its own process, for behaviour between processes",
    "product_defaults: the test home keeps Full Auto on and the real agents' start commands, conftest.py",
]

[tool.pyright]
# Strict over the common base, the chassis and the shipped modules, QUAL-004; tests are checked by running them.
include = ["src/metaform"]
exclude = ["**/tests", "**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
# One lint configuration for the whole repository, QUAL-005. The rule set is open, section 07 question 1;
# until it is chosen, Ruff's default rules apply.
line-length = 120
target-version = "py311"
