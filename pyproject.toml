[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metaform"
version = "0.1.0"
description = "Functional maps that give agents a project's purpose before they work on it."
requires-python = ">=3.11"
dependencies = ["mcp>=1.10", "prompt_toolkit>=3.0"]

[project.scripts]
metaform = "metaform.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/metaform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "req(id): the spec requirement a test protects, QUAL-009 and E4",
    "kind(kind): fixture, simulation or real, QUAL-014",
]
