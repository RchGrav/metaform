", "provider": null, "imperative": "must_not", "statement": "A network.interface event from netifd may rebind multicast, refresh names and recheck the firewall, but must not send a broadcast unless the node's advertised state changed, and then with exactly one reason."}, {"target": "join", "address": "code.system.operating", "provider": null, "imperative": "prefer", "statement": "Take any new library mgmd needs from OpenWrt 24.10's own feeds and add it to DEPENDS in mesh-gateway-manager/Makefile. Prefer the library OpenWrt already ships for the job over a vendored or alternative one."}, {"target": "join", "address": "code.manager.route", "provider": null, "imperative": "must", "statement": "After a successful ALIGN, DELETE or EJECT of a default route, call core_refresh_primary_route_if_changed, and do nothing else to publish. A route handler never broadcasts."}, {"target": "join", "address": "code.manager.route", "provider": "code.system.operating", "imperative": "must_not", "statement": "Never add a default route at a metric another gateway already holds. Pick the slot with find_free_metric, add with NLM_F_CREATE | NLM_F_REPLACE, and record the occupant for rollback."}, {"target": "join", "address": "code.protocol.routing.mesh", "provider": null, "imperative": "must", "statement": "Dump originators with BATADV_ATTR_MESH_IFINDEX set to the batman soft interface, mesh_ifname, never the bridge, and keep only rows flagged BATADV_ATTR_FLAG_BEST."}, {"target": "join", "address": "code.protocol.routing.mesh", "provider": null, "imperative": "must", "statement": "Query batman-adv through its generic netlink family. Do not add a new check that depends on a batman-adv sysfs path."}, {"target": "join", "address": "code.protocol.witness.state", "provider": null, "imperative": "must", "statement": "Build each witness from exactly three inputs, sender MAC, represented peer MAC and that peer's token, as FNV1a32 over 6 MAC bytes, 6 MAC bytes and the 8 token bytes least significant first. Change the inputs or the byte layout only on every node at once."}, {"target": "join", "address": "code.protocol.witness.state", "provider": "code.manager.route", "imperative": "must", "statement": "Advertise the primary uplink read back from the kernel's lowest-metric main-table default route after the route operation, not the route the event asked for."}, {"target": "join", "address": "code.watcher.reload", "provider": null, "imperative": "must", "statement": "Watch the /var/run directory, not the fw4 files, and take fw4.lock close or delete as reload completion, with fw4.state close-write accepted only when no lock activity was seen. Set G.reload_pending before any reload MGM starts, so its own completion is verified and only an external one re-enforces."}, {"target": "join", "address": "code.filter.packet", "provider": null, "imperative": "must", "statement": "Load MGM's rules only through the firewall.mgm include, type nftables at ruleset-append, from /var/run/mgm.nft, into chains fw4 itself creates: inet fw4 input, forward and srcnat. Keep the comment markers mesh-to-, return-from-, NAT-to- and MGM-multicast identical in the renderer and the verifier."}, {"target": "join", "address": "code.manager.firewall", "provider": null, "imperative": "must_not", "statement": "Set the forwarding and masquerade posture once at service start and restore the original on stop. Do not add firewall changes driven by a direct uplink coming up or going down."}, {"target": "join", "address": "code.tester.uplink", "provider": null, "imperative": "must_not", "statement": "Sentry must not write routes, the online or direct flags, or any mesh state. It hands each verdict to mgm_apply_sentry_state, and mgmd applies route and connectivity policy."}, {"target": "join", "address": "code.probe.dns", "provider": null, "imperative": "must", "statement": "Keep the query id layout ifindex:10, epoch:4, slot:2, and change sentry_compose_qid and sentry_decode_qid together. Within one interval, never have two in-flight probes to the same target: a top-up takes only a target that is outside the interface pool and not in flight."}, {"target": "join", "address": "code.probe.dns", "provider": null, "imperative": "must_not", "statement": "A late reply to an interval that confirmed DOWN, or to a probe sent before carrier or route loss, must not count as success or refill the pool. Mark the epoch DOWN and retire its in-flight probes at T3, and on physical loss clear every in-flight probe and close the socket."}, {"target": "join", "address": "code.probe.dns", "provider": null, "imperative": "must", "statement": "Send every probe with IP_PKTINFO naming the monitored interface's ifindex and its primary IPv4, and send nothing while that interface has no primary address."}, {"target": "join", "address": "code.failsafe.gateway.mesh", "provider": null, "imperative": "must", "statement": "Re-admit on one success. A single matched echo reply sets the SafeNet verdict online at once, with no holdoff or count."}, {"target": "join", "address": "code.failsafe.gateway.mesh", "provider": null, "imperative": "must", "statement": "Keep one probe in flight. The schedule skips a tick while a probe is outstanding, and a reply counts only when its ICMP id and sequence match the probe in flight."}, {"target": "join", "address": "code.resolver.recursive", "provider": null, "imperative": "must", "statement": "No configuration may leave a tester with zero resolver targets. Sentry falls back to the compiled seed list when resolvers.json is missing or invalid, and SafeNet falls back to 8.8.8.8 then 1.1.1.1 when probe_targets holds no valid IPv4. Keep both fallbacks when changing either loader."}, {"target": "join", "address": "code.tester.uplink", "provider": "code.resolver.recursive", "imperative": "must_not", "statement": "Do not require NOERROR or an A record. Any DNS reply from the probed resolver address with the matching query id proves the uplink, whatever its rcode or answer."}, {"target": "join", "address": "code.failsafe.gateway.mesh", "provider": "code.resolver.recursive", "imperative": "must", "statement": "Alternate the probe targets in probe_targets list order, IPv4 only, shipped as 8.8.8.8 then 1.1.1.1. Skip a non-IPv4 entry with a warning, and fall back to the shipped pair when none is valid."}], "prompts": [{"id": "canonical-intake", "name": "Canonical Intake", "versions": [{"v": 1, "text": "<?xml version='1.0' encoding='UTF-8'?>\n<process id=\"digital-typology\" version=\"1.1\">\n    <title>Digital Typology<\/title>\n    <purpose>\n        Define and construct a definitive system graph by topologically converging the functional elements of an under-examination artifact into load-bearing parent types that structurally contain their specific, active operational roles within the joins, generated by recursing each Vested Receiving Entity's objective purpose for a join-specific encounter function received through the functionalities of each of its Providing Elements\u2014ensuring the resulting joins express the atomic, active-voice realities particular to this specific artifact rather than its generic functional type.\n        <\/purpose>\n    <target type=\"[url|path|artifact|inline|inferred]\" value=\"[inferred]\" note=\"Location of the artifact to examine, name of the artifact in the working folder, or delivered outside of this structure as instructions in this message such as the critical structure of of a system to be used as a functional mapping tool. Switch type to inline and put the artifact's content in value instead if there's no location or a latent space construction task.\" />\n    <core_concepts>\n        <concept term=\"AUE\" full=\"Artifact Under Examination\" definition=\"The entity (thing or things) being examined, created, or used. Artifacts can include photographs, contracts, stories, resale assets, and software. The work can concern multiple artifacts and projects. Whether an AUE serves as an asset depends on its use in that context.\" />\n        <concept term=\"Join\" definition=\"A dictionary object that exists in the Receiving Entity (RE) with a relation in active voice, an observation of the actual real-world condition, format, layout, or limitations of what is there; additionally it contains a dictionary of objects containing type specific or AUE specific references and logic.\" />\n        <concept term=\"Element\" definition=\"An element is any nameable part of an entity as a type; however, just because an element can be named doesn't mean it is interesting, remarkable, or deserving of special attention. Many elements can be immediately seen, or are easily inferred.\" />\n        <concept term=\"Entity\" definition='An entity is a whole, independent thing with its own distinct existence, while an element is a smaller part or component that makes up that whole. All entities are elements, but not all elements are entities. Entity or an element depends entirely on your level of abstraction (your scope). The moment you zoom into a component and examine its internal composition, that component transitions conceptually from a passive \"element\" into an active \"entity\" with its own subordinate elements.' />\n        <concept term=\"VE\" full=\"Vested Entity\" definition=\"The party vested in the type of thing the artifact is: the type of party that holds an objective purpose for this type of object and drives the most improvement in it. The VE receives the join, holding the Operative Purpose that a Providing Element's Encounter Function serves.\" />\n        <concept term=\"PE\" full=\"Providing Element\" definition=\"The part satisfying the requirement actively declared by its Vested Receiving Entity through its Operative Purpose. This is the join's other endpoint: whatever's EF fulfills the VE's OP.\" />\n        <concept term=\"AT\" full=\"Artifact Type\" definition=\"This is a general category or classification that groups individual artifacts together based on shared characteristics. Artifact Types can be used to anneal or combine many of the same type of AUE into types (for example photos, data objects, scripts, templates, etc).\" />\n        <concept term=\"NE\" full=\"Notable Element\" definition=\"A component, interface, or specification that defines an essential demand or requirement. It is **notable** because it highlights what a system or component explicitly expects, needs, or depends on from its external environment to operate successfully.\" />\n        <concept term=\"OP\" full=\"Operative Purpose\" definition=\"The **why**. This is the active goal held in a Vested Receiving Entity's join dictionary \u2014 that an element's encounter function intends to accomplish.\" />\n        <concept term=\"EF\" full=\"Encounter Function\" definition=\"The **how** of what is delivered.  This may be understood as the function of an encounter or the encounter of a function depending on the contextual understanding of the Artifact. This is the mechanism, interface, relationship, or method through which an AUE or Element performs its purpose for its Vested Receiving Entity. It explains how the effect is encountered, used, or experienced. The EF belongs to the Providing Element, but is stored in the Vested Receiving Entity-owned join because a PE element type's functionality on the whole may satisfy different Vested Entities' Operative Purposes through different Encounter Functions. Record the PE's EF for that specific encounter in the join; do not create a single element-level EF record outside its joins.\" />\n        <concept term=\"DE\" full=\"Defining Element\" definition=\"The notable element of this AUE whose loss would prevent the AUE from remaining the same type. Its Encounter Function services the OP of a VRE outside of this AUE, names the functional type of the AUE as a converged result of the functionality of the AUE being examined. Its defining function is expressed independently of medium, encoding, genre, and style.\" />\n        <concept term=\"SE\" full=\"Supportive\" definition=\"An element whose Encounter Function helps the DE serve the VE's OP. It counts as supportive because of what it contributes to this AUE, even when that contribution is weak, replaceable, or could be improved. Judge it by its role in the AUE, not by what the thing it represents does in the real world.\" />\n        <concept term=\"Parametric\" definition=\"A quality or quantity that can be tuned but does not carry a specific name in the scope of the namespace of this AUE. We do not name parametrics with a namespace address in this graph or as part of this operation.\" />\n        <concept term=\"NS\" full=\"Namespace Scope\" definition=\"The scope of the Artifact Type. The five base valid types are code, document, media, data, and stakeholder.\" />\n    <\/core_concepts>\n    <vested_entity_rules>\n        <rules>\n            <rule>The VE is the party vested in the type of thing the artifact is.<\/rule>\n            <rule>The VE is especially important because it forms the tripartite join that makes each join artifact specific: the VE as receiver, its Operative Purpose as the why, and the Providing Element's Encounter Function as the how.<\/rule>\n            <rule>Elements are types, so the VE is a type: the type of party that holds an objective purpose for this type of object.<\/rule>\n            <rule>Identify the VE by asking who drives the most improvement in an artifact of this type.<\/rule>\n            <rule>Deciding on the VE takes deep consideration because it is not a present element in what you are examining. Infer it from what the artifact is; do not look for it in the artifact.<\/rule>\n            <rule>The VE is not the developer, the user, or anyone performing the operation. That could be said of every artifact, so it identifies nothing about this one, and it is the wrong way to be reasoning.<\/rule>\n        <\/rules>\n        <examples type=\"vested_entity\">\n            <example artifact_type=\"media.photo\" ve=\"seller\" valid=\"true\" reason=\"the owner, the insurance agent, and the buyer seeking proof of condition all have goals for the photo, but only the seller goes out of their way to show the object in the very best light: placing it in a photobox, presenting it well, showing how it is used\" />\n            <example artifact_type=\"media.photo\" ve=\"operator\" valid=\"false\" reason=\"the party performing the operation could be named for every artifact, so it identifies nothing about this one\" />\n        <\/examples>\n    <\/vested_entity_rules>\n    <join_types>\n        <join_type name=\"purpose\" scope=\"intake\" />\n    <\/join_types>\n    <namespace_rules>\n        <rules>\n            <rule>For each dotted part, the address in the namespace must be reversible and read as its name.<\/rule>\n            <rule>All artifacts are entities, all entities are not artifacts, all entities are elements, all elements are not entities.  (Artifacts \u2282 Entities \u2282 Elements)<\/rule>\n            <rule>Namespace entries must describe the type of functional approach as a proper noun.<\/rule>\n            <rule>To be placed into the namespace, an entry must be the same thing as its parent type, or a function within its parent type, and never a non-functionality.<\/rule>\n            <rule>There must be one or more entities each with a distinct unique objective purpose and encounter function for the defining element.<\/rule>\n            <rule>Children must take their parent's name as their last name when reversed and read as a noun.<\/rule>\n            <rule>Multi-word names: when the new leaf is a variant functionality of its parent type, such as physics engine and game engine, express the namespace with periods between the segments: code.engine.game, code.engine.physics. Every prefix is a complete type that yields its own inference and passes its practices to its children, so words that form a valid prefix of their own must remain separate segments. Words may be joined with underscores in one segment only when none of them forms a valid prefix, as in code.queue.dead_letter and data.bill_of_materials, where the name must also read correctly once reversed.<\/rule>\n            <rule>Specify the name_length value indicating the lookback segment count as its acceptable short name that is well understood.<\/rule>\n            <rule>The segments in the namespace can be reversed by replacing periods with spaces to read properly as an inferenceable, well understood name.<\/rule>\n            <rule>It must be a part or type of its parent scope.<\/rule>\n            <rule>Namespace must narrow from trunk to leaf.<\/rule>\n            <rule>The namespace address names the type. The join refines that type with what this AUE does, so the address stays general and the join stays specific.<\/rule>\n        <\/rules>\n        <root_types>\n            <root_type name=\"code\" />\n            <root_type name=\"document\" />\n            <root_type name=\"media\" />\n            <root_type name=\"data\" />\n            <root_type name=\"stakeholder\" />\n        <\/root_types>\n        <note>This is a typological ontology, it is not a taxonomy. It does not have fillers like domain and class, and it does not prescribe a minimum or maximum segment count per entity.<\/note>\n        <examples type=\"reading\">\n            <example namespace_address=\"code.loop.main\" reading=\"main loop program code\" />\n            <example namespace_address=\"code.bus.data.event\" reading=\"event data bus code\" />\n        <\/examples>\n        <examples type=\"namespace_validity\">\n            <example namespace_address=\"code.game\" valid=\"false\" reason=\"game is not a function\" />\n            <example namespace_address=\"code.game.engine\" valid=\"false\" reason=\"reverses to 'engine game', a subject/genre variant (a game about engines) rather than a recognized functional type \u2014 the same non-functionality basis that invalidates platformer; also sits under the already-invalid code.game parent.\" />\n            <example namespace_address=\"code.engine.game\" valid=\"true\" reason=\"represents game engine program code; 'game engine' is a functional type because it provides the runtime a game runs on (the main loop, rendering, input, and simulation) independent of any particular game's genre or content, and it is widely known by that exact name\" />\n            <example namespace_address=\"code.engine.game.fps\" valid=\"true\" reason=\"valid as a functional type \u2014 a distinct functionality\" note=\"load-bearing example; initial intake references this via a join as a major core functionality in code.engine.game, with code.engine.game.fps as a supportive element\" proof=\"first-person camera viewpoint with a targeting reticle\" />\n            <example namespace_address=\"code.engine.game.platformer\" valid=\"false\" reason=\"invalid as a functional subtype; it defines the fundamental challenge and objective of a game, not a technical functionality\" note=\"load-bearing invalid example\" proof=\"spatial navigation and overcoming environmental obstacles\" />\n            <example namespace_address=\"media.image\" valid=\"true\" reason=\"images are a base valid functional type under the media root.\" />\n            <example namespace_address=\"media.asset.image\" valid=\"true\" reason=\"Images are assets when they are named as a functional element type in a AUE.\" />\n            <example namespace_address=\"media.photo\" valid=\"true\" reason=\"represents a photograph, photos have defining elements, and sometimes supportive elements, a couple (DE) at the eiffel tower (SE), a car (DE) in the street, a car (DE) racing at the racetrack (SE), a photo of the grand canyon (DE) in the distance a man and a mule (SE)\" />\n            <example namespace_address=\"media.photo.scenery\" valid=\"true\" reason=\"this is functional representation of a scene as the DE, a scenery photo has a subject that isnt the DE, all scenes have a subject but the scene is the focus\" />\n            <example namespace_address=\"media.photo.id\" valid=\"true\" reason=\"represents a identification photograph\" />\n            <example namespace_address=\"media.photo.id.passport\" valid=\"false\" reason=\"passport is not a function, this is a purpose\" />\n            <example namespace_address=\"media.photo.jpg\" valid=\"false\" reason=\"this is encoding\" />\n            <example namespace_address=\"code.cpp\" valid=\"false\" reason=\"this is language\" />\n            <example namespace_address=\"document.word.story.conflict\" valid=\"false\" reason=\"'word' is naming an encoding and does not name a functional approach at the proper namespace level\" />\n            <example namespace_address=\"document.story.conflict\" valid=\"true\" reason=\"represents story conflict as a document element\" />\n        <\/examples>\n    <\/namespace_rules>\n    <method deliverable_format=\"xml\">\n        <steps>\n            <step n=\"1\" text=\"FOR each AUE; organize into AT groups capable of generating a useful imperative for an agent based on the (OP of the VRE) and the (EF of the PE) of the AUE's DE in service of the VRE's OP as the stakeholder; NEXT AUE. Where the intake receives a folder or collection, survey every member before grouping is finalized: observe each member, reason its AT, its DE, its SE and DET elements, and the OP and EF relationships that distinguish its functionality; group only members whose shared functionality supports the same AT-level imperative, while retaining member identity through refs where needed.\" />\n            <step n=\"2\" text=\"FOR each AT; create a namespace entry for the entity as a VRE, add its OP and EF from step 1 in a join as ref elements using key='path' and value='[relative path]' to identify the members; NEXT AT.\" />\n            <step n=\"3\" text=\"FOR each AUE; FOR each AT; observe DE as a VRE and decompose its requirements and dependencies as EF of other elements. The DE simultaneously remains the PE serving the external VRE's OP where that relationship exists. Whenever an encountered element itself bears an OP, trace it as a VRE without creating a duplicate namespace record. NEXT AT; NEXT AUE.\" />\n            <step n=\"4\" text=\"For each element with an EF that serves the intent of an OP, create a join record in the VRE of type purpose; add the active OP statement as the purpose, the non_goal where the VRE holds one, the Providing Element's Encounter Function as function, the Providing Element's namespace address in the provider field, the active-voice relation, the observation of the actual real-world condition, format, layout, or limitations of what is there, and refs where needed.\" />\n            <step n=\"5\" text=\"Perform this task recursively, starting with the element named in the first OP: move to the next element and treat it as the VRE where it bears requirements or an OP of its own.\" />\n            <step n=\"6\" text=\"Find that element's OPs: what it needs and wants from the rest of the AUE, or from outside it, in order to deliver its own EF. Element functionality serves the OP of entities, so every OP found traces back through its receivers to the OP of the external VRE.\" />\n            <step n=\"7\" text=\"Continue until there are no more unsatisfied OPs, or NEs of this AUE that must be named to understand the artifact. Parametric Elements are never NEs and are not part of intake \u2014 a tunable quality or quantity that doesn't carry its own name in artifacts of this type is not named or enumerated here, no matter how many of them exist.\" />\n            <step n=\"8\" text=\"When the trace ends, return to the survey of step 1. No aspect of the functionality of the AUE is left out: for each functionality the trace has not reached, find the VRE whose OP it serves and record the join. Where it is only a part of a functionality already named, the function of that parent's join states it.\" />\n            <step n=\"9\" text=\"Anneal and combine elements where you can infer a functionality that can further refine the structure by absorbing functional subparts because they logically share the same join, and never absorb a subpart whose objective purpose the parent functionality cannot itself carry.\" />\n            <step n=\"9b\" text=\"Combining never optimizes a functionality away. Combine only where a bigger functionality describes both, and let the purpose join carry the combined encounter.\" />\n            <step n=\"10\" text=\"When combining elements, seek a common element name that can be placed in the namespace and that adheres to the namespace naming rules while logically containing the combined elements.\" />\n            <step n=\"11\" text=\"Converge to the final shape. The result is a defining map of parent functionalities: an element absorbed under steps 9-10 is retained strictly as an internal subtype of its load-bearing parent functionality. It is not mapped to the external global graph; its atomic completeness, unique active-voice relation, and specific encounter functions are preserved within a private, internal subtype join.\" />\n        <\/steps>\n        <persistent_directive applies_from=\"step_5\" text=\"Keep this document.\" />\n        <output_instruction applies_from=\"step_11\" text=\"Return only the final xml shape.\" />\n    <\/method>\n    <goal>\n    The goal is to refine a high value metaform to be mapped to capture the shape of the artifacts function by performing a element by element trace operation focused strictly on the functionality.  You must traversing your models latent space understanding of functionality while avoiding genres, medium, encoding, style and other varients of functionality. Assemble the elements types you see as high value then address them by the namespace rules, and record the OP of each VRE (in a join of type \"purpose\" describing the active why and the EF) of another element. Do not perform a deeper intake based on variants which do not describe functionality on the leaf, such as any kind of genre, style, or other things which are not distinctly an observed functionality form. It is imperative to recognize the load-bearing nature of this statement and of this operation as a whole.\n    <\/goal>\n    <constraints>\n        <constraint>Elements represent discrete functional roles actively instantiated by this artifact, named and described at their most specific reusable type level.<\/constraint>\n        <constraint>Never use vague top-level labels where a specific functional mechanism exists.<\/constraint>\n        <constraint>Keep namespace identity type-level; the joins carry the AUE-specific Operative Purpose, Encounter Function, relation, observation, refs, and non_goal where present.<\/constraint>\n        <constraint>After working through the process and the closure pass, attempt to anneal joins and combine elements to a final shape that speaks to the artifact type.<\/constraint>\n        <constraint>You must seek to create a thorough and complete map of the parent functionalities.<\/constraint>\n        <constraint>Keep the graph shape limited to artifact's functional elements as a type, while speaking to the function of the AUE as a whole in its joins.<\/constraint>\n        <constraint>Focus on the notable elements of interest and observe that just because it can be named doesn't mean it is interesting, remarkable, or deserving of special attention.<\/constraint>\n        <constraint>A join speaks about this artifact. Its purpose and function state what this AUE actually does, in its own particulars.<\/constraint>\n        <constraint>The join data must speak to the AUE. Where an AUE represents something, describe the function of that representation within the AUE rather than substituting the independent real-world functionality of what is represented.<\/constraint>\n        <constraint>For every AUE, seek SE elements as defined in core concepts.<\/constraint>\n        <constraint>Intake is never gated or judged; only the resulting map may be graded and the intake refined contextually afterward.<\/constraint>\n    <\/constraints>\n    <completion_condition>\n    The task is complete when the final result is a minimal base shape of notable categorical elements of the artifact, joined by artifact-specific Operative Purposes, suitable for later expansion through project memory graph relations and other knowledge layers.\n  <\/completion_condition>\n    <response_protocol>\n        <instructions>\n            <instruction>result carries an id. This file never uses it internally \u2014 it exists so this result can later be pasted into digital-typology-expand.xml's canonical_input, whose deep_result links back via a matching ref. Generate it even though nothing in this file's own output points to it.<\/instruction>\n            <instruction>Respond with well-formed XML matching the schema below \u2014 no prose, no markdown, no commentary outside the XML. result is the document root \u2014 do not wrap it in any outer tag, including the process's own name or title.<\/instruction>\n            <instruction>Elements and joins express the final annealed shape after Method step 11. Keep the root element list minimal, coarse, and shallow per Goal and Constraints by absorbing subparts. Do not emit absorbed subparts as independent root elements; instead, preserve their atomic realities exclusively as nested join subtypes inside the load-bearing parent's matching purpose join.<\/instruction>\n            <instruction>An element's identity is its namespace_address attribute, not its readable name. \"tool registry\" is prose; code.registry.tool is the element. Any reference to an element, in a join or anywhere else, must use that namespace_address value, never the name alone. A name with no matching namespace_address isn't a valid reference to anything.<\/instruction>\n            <instruction>All namespace records are elements. An element inside the AUE carries exactly one role of DE, SE, or NE. A VRE outside the AUE is still represented as an element but does not receive an AUE role merely to fit the schema. PE is not a role attribute: it is the join's other endpoint. The same element may bear an OP as a VRE in one join and provide an EF as a PE in another without duplication.<\/instruction>\n            <instruction>Joins connect the VRE bearing the OP to the PE providing for it, and carry purpose, function, relation in active voice, observation of the actual real-world condition, format, layout, or limitations of what is there, optional non_goal, and refs where required. This applies to every join.<\/instruction>\n            <instruction>Include refs on a join only when it needs type-specific or artifact-specific references or logic beyond purpose, function, relation, observation, or non_goal.<\/instruction>\n            <instruction>non_goal is optional and records a pertinent outcome the VRE does not seek where it materially clarifies the OP. Omit it when it does not apply.<\/instruction>\n        <\/instructions>\n        <schema>\n            <result id=\"[generated result id]\">\n                <elements>\n                    <!-- All namespace records remain elements -->\n                    <element namespace_address=\"[dotted namespace address]\" name_length=\"[proper_noun_lookback_segment_count]\" role=\"[AUE|VE|DE|SE|NE]\">\n                        <!-- Informal Name -->\n                        <name/>\n                        <joins>\n                            <join type=\"purpose\" provider=\"[namespace address of the Providing Element]\" purpose=\"[State the intended goal, standard, or reason why this element or action is needed.]\" function=\"[Encounter Function of the Providing Element serving this VRE's OP]\" relation=\"[active-voice relation]\" observation=\"[State the actual real-world condition, format, layout, or limitations of what is there.]\" non_goal=\"[State what this element or action is explicitly NOT trying to do, fix, or include.]\">\n                                <element namespace_address=\"[dotted namespace address]\" name_length=\"[proper_noun_lookback_segment_count]\" role=\"[AUE|DE|SE|NE]\">\n                                    <name/>\n                                    <refs>\n                                        <!-- Uniform dictionary shape for type-specific or artifact-specific keys -->\n                                        <ref key=\"[key]\" value=\"[value]\" />\n                                    <\/refs>\n                                <\/element>\n                            <\/join>\n                        <\/joins>\n                    <\/element>\n                <\/elements>\n            <\/result>\n        <\/schema>\n    <\/response_protocol>\n<\/process>\n", "saved": "2026-09-24 17:45"}, {"v": 2, "text": "<?xml version='1.0' encoding='UTF-8'?>\n<process id=\"digital-typology\" version=\"1.1\">\n    <title>Digital Typology<\/title>\n    <purpose>\n        Define and construct a definitive system graph by topologically converging the functional elements of an under-examination artifact into load-bearing parent types that structurally contain their specific, active operational roles within the joins, generated by recursing each Vested Receiving Entity's objective purpose for a join-specific encounter function received through the functionalities of each of its Providing Elements\u2014ensuring the resulting joins express the atomic, active-voice realities particular to this specific artifact rather than its generic functional type.\n        <\/purpose>\n    <target type=\"[url|path|artifact|inline|inferred]\" value=\"[inferred]\" note=\"Location of the artifact to examine, name of the artifact in the working folder, or delivered outside of this structure as instructions in this message such as the critical structure of a system to be used as a functional mapping tool. Switch type to inline and put the artifact's content in value instead if there's no location or a latent space construction task.\" />\n    <core_concepts>\n        <concept term=\"AUE\" full=\"Artifact Under Examination\" definition=\"The entity (thing or things) being examined, created, or used. Artifacts can include photographs, contracts, stories, resale assets, and software. The work can concern multiple artifacts and projects. Whether an AUE serves as an asset depends on its use in that context.\" />\n        <concept term=\"Join\" definition=\"A dictionary object that exists in the Receiving Entity (RE) with a relation in active voice, an observation of the actual real-world condition, format, layout, or limitations of what is there; additionally it contains a dictionary of objects containing type specific or AUE specific references and logic.\" />\n        <concept term=\"Element\" definition=\"An element is any nameable part of an entity as a type; however, just because an element can be named doesn't mean it is interesting, remarkable, or deserving of special attention. Many elements can be immediately seen, or are easily inferred.\" />\n        <concept term=\"Entity\" definition='An entity is a whole, independent thing with its own distinct existence, while an element is a smaller part or component that makes up that whole. All entities are elements, but not all elements are entities. Entity or an element depends entirely on your level of abstraction (your scope). The moment you zoom into a component and examine its internal composition, that component transitions conceptually from a passive \"element\" into an active \"entity\" with its own subordinate elements.' />\n        <concept term=\"VE\" full=\"Vested Entity\" definition=\"The party vested in the type of thing the artifact is: the type of party that holds an objective purpose for this type of object and drives the most improvement in it. The VE receives the join, holding the Operative Purpose that a Providing Element's Encounter Function serves.\" />\n        <concept term=\"PE\" full=\"Providing Element\" definition=\"The part satisfying the requirement actively declared by its Vested Receiving Entity through its Operative Purpose. This is the join's other endpoint: whatever's EF fulfills the VE's OP.\" />\n        <concept term=\"AT\" full=\"Artifact Type\" definition=\"This is a general category or classification that groups individual artifacts together based on shared characteristics. Artifact Types can be used to anneal or combine many of the same type of AUE into types (for example photos, data objects, scripts, templates, etc).\" />\n        <concept term=\"NE\" full=\"Notable Element\" definition=\"A component, interface, or specification that defines an essential demand or requirement. It is **notable** because it highlights what a system or component explicitly expects, needs, or depends on from its external environment to operate successfully.\" />\n        <concept term=\"OP\" full=\"Operative Purpose\" definition=\"The **why**. This is the active goal held in a Vested Receiving Entity's join dictionary \u2014 that an element's encounter function intends to accomplish.\" />\n        <concept term=\"EF\" full=\"Encounter Function\" definition=\"The **how** of what is delivered.  This may be understood as the function of an encounter or the encounter of a function depending on the contextual understanding of the Artifact. This is the mechanism, interface, relationship, or method through which an AUE or Element performs its purpose for its Vested Receiving Entity. It explains how the effect is encountered, used, or experienced. The EF belongs to the Providing Element, but is stored in the Vested Receiving Entity-owned join because a PE element type's functionality on the whole may satisfy different Vested Entities' Operative Purposes through different Encounter Functions. Record the PE's EF for that specific encounter in the join; do not create a single element-level EF record outside its joins.\" />\n        <concept term=\"DE\" full=\"Defining Element\" definition=\"The notable element of this AUE whose loss would prevent the AUE from remaining the same type. Its Encounter Function services the OP of a VRE outside of this AUE, names the functional type of the AUE as a converged result of the functionality of the AUE being examined. Its defining function is expressed independently of medium, encoding, genre, and style.\" />\n        <concept term=\"SE\" full=\"Supportive Element\" definition=\"An element whose Encounter Function helps the DE serve the VE's OP. It counts as supportive because of what it contributes to this AUE, even when that contribution is weak, replaceable, or could be improved. Judge it by its role in the AUE, not by what the thing it represents does in the real world.\" />\n        <concept term=\"Parametric\" definition=\"A quality or quantity that can be tuned but does not carry a specific name in the scope of the namespace of this AUE. We do not name parametrics with a namespace address in this graph or as part of this operation.\" />\n        <concept term=\"NS\" full=\"Namespace Scope\" definition=\"The scope of the Artifact Type. The five base valid types are code, document, media, data, and stakeholder.\" />\n    <\/core_concepts>\n    <vested_entity_rules>\n        <rules>\n            <rule>We call an entity outside the artifact vested because all we can do is infer its purpose.<\/rule>\n            <rule>Assume an artifact is converted into a metaform to improve it. The VEs that matter are the ones whose purpose drives changes or improvements to the artifact. Enumerate each of them.<\/rule>\n            <rule>The VE that drives the most improvement gives the best inference.<\/rule>\n            <rule>Never the person who asked for the intake, and never the end user.<\/rule>\n            <rule>The VE is the party vested in the type of thing the artifact is.<\/rule>\n            <rule>The VE is especially important because it forms the tripartite join that makes each join artifact specific: the VE as receiver, its Operative Purpose as the why, and the Providing Element's Encounter Function as the how.<\/rule>\n            <rule>Elements are types, so the VE is a type: the type of party that holds an objective purpose for this type of object, named at its most specific reusable type level.<\/rule>\n            <rule>When one person can hold several roles, name the role that changes the artifact, by the title that role carries.<\/rule>\n            <rule>Identify the VE by asking who drives the most improvement in an artifact of this type.<\/rule>\n            <rule>Deciding on the VE takes deep consideration because it is not a present element in what you are examining. Infer it from what the artifact is; do not look for it in the artifact.<\/rule>\n            <rule>The VE is not the developer, the user, or anyone performing the operation. That could be said of every artifact, so it identifies nothing about this one, and it is the wrong way to be reasoning.<\/rule>\n        <\/rules>\n        <examples type=\"vested_entity\">\n            <example artifact_type=\"media.photo\" ve=\"seller\" valid=\"true\" reason=\"the owner, the insurance agent, and the buyer seeking proof of condition all have goals for the photo, but only the seller goes out of their way to show the object in the very best light: placing it in a photobox, presenting it well, showing how it is used\" />\n            <example artifact_type=\"media.photo\" ve=\"operator\" valid=\"false\" reason=\"the party performing the operation could be named for every artifact, so it identifies nothing about this one\" />\n            <example artifact_type=\"media.photo\" ve=\"asset owner\" valid=\"false\" reason=\"a category that covers the seller, the collector, and the estate alike; it identifies no one who improves the photo\" />\n            <example artifact_type=\"media.photo\" ve=\"buyer\" valid=\"false\" reason=\"the buyer judges the photo; judging does not change or improve it\" />\n            <example artifact_type=\"media.photo\" ve=\"insurance company\" valid=\"false\" reason=\"the insurance company records the photo and does not want it changed\" />\n            <example artifact_type=\"media.photo\" ve=\"social media poster\" valid=\"true\" reason=\"a social media post drives changes or improvements to the photo\" />\n            <example artifact_type=\"media.photo\" ve=\"blogger\" valid=\"true\" reason=\"a blogger drives changes or improvements to the photo\" />\n        <\/examples>\n    <\/vested_entity_rules>\n    <join_types>\n        <join_type name=\"purpose\" scope=\"intake\" />\n    <\/join_types>\n    <namespace_rules>\n        <rules>\n            <rule>For each dotted part, the address in the namespace must be reversible and read as its name.<\/rule>\n            <rule>All artifacts are entities, all entities are not artifacts, all entities are elements, all elements are not entities.  (Artifacts \u2282 Entities \u2282 Elements)<\/rule>\n            <rule>Namespace entries must describe the type of functional approach as a proper noun.<\/rule>\n            <rule>To be placed into the namespace, an entry must be the same thing as its parent type, or a function within its parent type, and never a non-functionality.<\/rule>\n            <rule>There must be one or more entities each with a distinct unique objective purpose and encounter function for the defining element.<\/rule>\n            <rule>Children must take their parent's name as their last name when reversed and read as a noun.<\/rule>\n            <rule>Multi-word names: when the new leaf is a variant functionality of its parent type, such as physics engine and game engine, express the namespace with periods between the segments: code.engine.game, code.engine.physics. Every prefix is a complete type that yields its own inference and passes its practices to its children, so words that form a valid prefix of their own must remain separate segments. Words may be joined with underscores in one segment only when none of them forms a valid prefix, as in code.queue.dead_letter and data.bill_of_materials, where the name must also read correctly once reversed.<\/rule>\n            <rule>Specify the name_length value indicating the lookback segment count as its acceptable short name that is well understood.<\/rule>\n            <rule>The segments in the namespace can be reversed by replacing periods with spaces to read properly as an inferenceable, well understood name.<\/rule>\n            <rule>It must be a part or type of its parent scope.<\/rule>\n            <rule>Namespace must narrow from trunk to leaf.<\/rule>\n            <rule>The namespace address names the type. The join refines that type with what this AUE does, so the address stays general and the join stays specific.<\/rule>\n        <\/rules>\n        <root_types>\n            <root_type name=\"code\" />\n            <root_type name=\"document\" />\n            <root_type name=\"media\" />\n            <root_type name=\"data\" />\n            <root_type name=\"stakeholder\" />\n        <\/root_types>\n        <note>This is a typological ontology, it is not a taxonomy. It does not have fillers like domain and class, and it does not prescribe a minimum or maximum segment count per entity.<\/note>\n        <examples type=\"reading\">\n            <example namespace_address=\"code.loop.main\" reading=\"main loop program code\" />\n            <example namespace_address=\"code.bus.data.event\" reading=\"event data bus code\" />\n        <\/examples>\n        <examples type=\"namespace_validity\">\n            <example namespace_address=\"code.game\" valid=\"false\" reason=\"game is not a function\" />\n            <example namespace_address=\"code.game.engine\" valid=\"false\" reason=\"reverses to 'engine game', a subject/genre variant (a game about engines) rather than a recognized functional type \u2014 the same non-functionality basis that invalidates platformer; also sits under the already-invalid code.game parent.\" />\n            <example namespace_address=\"code.engine.game\" valid=\"true\" reason=\"represents game engine program code; 'game engine' is a functional type because it provides the runtime a game runs on (the main loop, rendering, input, and simulation) independent of any particular game's genre or content, and it is widely known by that exact name\" />\n            <example namespace_address=\"code.engine.game.fps\" valid=\"true\" reason=\"valid as a functional type \u2014 a distinct functionality\" note=\"load-bearing example; initial intake references this via a join as a major core functionality in code.engine.game, with code.engine.game.fps as a supportive element\" proof=\"first-person camera viewpoint with a targeting reticle\" />\n            <example namespace_address=\"code.engine.game.platformer\" valid=\"false\" reason=\"invalid as a functional subtype; it defines the fundamental challenge and objective of a game, not a technical functionality\" note=\"load-bearing invalid example\" proof=\"spatial navigation and overcoming environmental obstacles\" />\n            <example namespace_address=\"media.image\" valid=\"true\" reason=\"images are a base valid functional type under the media root.\" />\n            <example namespace_address=\"media.asset.image\" valid=\"true\" reason=\"Images are assets when they are named as a functional element type in a AUE.\" />\n            <example namespace_address=\"media.photo\" valid=\"true\" reason=\"represents a photograph, photos have defining elements, and sometimes supportive elements, a couple (DE) at the eiffel tower (SE), a car (DE) in the street, a car (DE) racing at the racetrack (SE), a photo of the grand canyon (DE) in the distance a man and a mule (SE)\" />\n            <example namespace_address=\"media.photo.scenery\" valid=\"true\" reason=\"this is functional representation of a scene as the DE, a scenery photo has a subject that isnt the DE, all scenes have a subject but the scene is the focus\" />\n            <example namespace_address=\"media.photo.id\" valid=\"true\" reason=\"represents a identification photograph\" />\n            <example namespace_address=\"media.photo.id.passport\" valid=\"false\" reason=\"passport is not a function, this is a purpose\" />\n            <example namespace_address=\"media.photo.jpg\" valid=\"false\" reason=\"this is encoding\" />\n            <example namespace_address=\"code.cpp\" valid=\"false\" reason=\"this is language\" />\n            <example namespace_address=\"document.word.story.conflict\" valid=\"false\" reason=\"'word' is naming an encoding and does not name a functional approach at the proper namespace level\" />\n            <example namespace_address=\"document.story.conflict\" valid=\"true\" reason=\"represents story conflict as a document element\" />\n        <\/examples>\n    <\/namespace_rules>\n    <method deliverable_format=\"xml\">\n        <steps>\n            <step n=\"1\" text=\"FOR each AUE; organize into AT groups capable of generating a useful imperative for an agent based on the (OP of the VRE) and the (EF of the PE) of the AUE's DE in service of the VRE's OP as the stakeholder; NEXT AUE. Where the intake receives a folder or collection, survey every member before grouping is finalized: observe each member, reason its AT, its DE, its SE and DET elements, and the OP and EF relationships that distinguish its functionality; group only members whose shared functionality supports the same AT-level imperative, while retaining member identity through refs where needed.\" />\n            <step n=\"2\" text=\"FOR each AT; create a namespace entry for the entity as a VRE, add its OP and EF from step 1 in a join, and identify the members in that join's refs using key='path' and value='[relative path]'; NEXT AT.\" />\n            <step n=\"3\" text=\"FOR each AUE; FOR each AT; observe DE as a VRE and decompose its requirements and dependencies as EF of other elements. The DE simultaneously remains the PE serving the external VRE's OP where that relationship exists. Whenever an encountered element itself bears an OP, trace it as a VRE without creating a duplicate namespace record. NEXT AT; NEXT AUE.\" />\n            <step n=\"4\" text=\"For each element with an EF that serves the intent of an OP, create a join record in the VRE of type purpose; add the active OP statement as the purpose, the non_goal where the VRE holds one, the Providing Element's Encounter Function as function, the Providing Element's namespace address in the provider field, the active-voice relation, the observation of the actual real-world condition, format, layout, or limitations of what is there, and refs where needed.\" />\n            <step n=\"5\" text=\"Perform this task recursively, starting with the element named in the first OP: move to the next element and treat it as the VRE where it bears requirements or an OP of its own.\" />\n            <step n=\"6\" text=\"Find that element's OPs: what it needs and wants from the rest of the AUE, or from outside it, in order to deliver its own EF. Element functionality serves the OP of entities, so every OP found traces back through its receivers to the OP of the external VRE.\" />\n            <step n=\"7\" text=\"Continue until there are no more unsatisfied OPs, or NEs of this AUE that must be named to understand the artifact. Parametric Elements are never NEs and are not part of intake \u2014 a tunable quality or quantity that doesn't carry its own name in artifacts of this type is not named or enumerated here, no matter how many of them exist.\" />\n            <step n=\"8\" text=\"When the trace ends, return to the survey of step 1. No aspect of the functionality of the AUE is left out: for each functionality the trace has not reached, find the VRE whose OP it serves and record the join. Where it is only a part of a functionality already named, the function of that parent's join states it.\" />\n            <step n=\"9\" text=\"Anneal and combine elements where you can infer a functionality that can further refine the structure by absorbing functional subparts because they logically share the same join, and never absorb a subpart whose objective purpose the parent functionality cannot itself carry.\" />\n            <step n=\"9b\" text=\"Combining never optimizes a functionality away. Combine only where a bigger functionality describes both, and let the purpose join carry the combined encounter.\" />\n            <step n=\"9c\" text=\"A subpart is absorbed only when the parent's purpose join already states its purpose. A subpart with an objective purpose of its own stays its own element.\" />\n            <step n=\"10\" text=\"When combining elements, seek a common element name that can be placed in the namespace and that adheres to the namespace naming rules while logically containing the combined elements.\" />\n            <step n=\"11\" text=\"Converge to the final shape. The result is a defining map of parent functionalities: an element absorbed under steps 9-10 is retained strictly as an internal subtype of its load-bearing parent functionality. It is not mapped to the external global graph; its atomic completeness, unique active-voice relation, and specific encounter functions are preserved within a private, internal subtype join.\" />\n        <\/steps>\n        <persistent_directive applies_from=\"step_5\" text=\"Keep this document.\" />\n        <output_instruction applies_from=\"step_11\" text=\"Return only the final xml shape.\" />\n    <\/method>\n    <goal>\n    The goal is to refine a high value metaform to be mapped to capture the shape of the artifacts function by performing a element by element trace operation focused strictly on the functionality.  You must traversing your models latent space understanding of functionality while avoiding genres, medium, encoding, style and other varients of functionality. Assemble the elements types you see as high value then address them by the namespace rules, and record the OP of each VRE (in a join of type \"purpose\" describing the active why and the EF) of another element. Do not perform a deeper intake based on variants which do not describe functionality on the leaf, such as any kind of genre, style, or other things which are not distinctly an observed functionality form. It is imperative to recognize the load-bearing nature of this statement and of this operation as a whole.\n    <\/goal>\n    <constraints>\n        <constraint>Elements represent discrete functional roles actively instantiated by this artifact, named and described at their most specific reusable type level.<\/constraint>\n        <constraint>Never use vague top-level labels where a specific functional mechanism exists.<\/constraint>\n        <constraint>Keep namespace identity type-level; the joins carry the AUE-specific Operative Purpose, Encounter Function, relation, observation, refs, and non_goal where present.<\/constraint>\n        <constraint>After working through the process and the closure pass, attempt to anneal joins and combine elements to a final shape that speaks to the artifact type.<\/constraint>\n        <constraint>You must seek to create a thorough and complete map of the parent functionalities.<\/constraint>\n        <constraint>Keep the graph shape limited to artifact's functional elements as a type, while speaking to the function of the AUE as a whole in its joins.<\/constraint>\n        <constraint>Focus on the notable elements of interest and observe that just because it can be named doesn't mean it is interesting, remarkable, or deserving of special attention.<\/constraint>\n        <constraint>A join speaks about this artifact. Its purpose and function state what this AUE actually does, in its own particulars.<\/constraint>\n        <constraint>The join data must speak to the AUE. Where an AUE represents something, describe the function of that representation within the AUE rather than substituting the independent real-world functionality of what is represented.<\/constraint>\n        <constraint>For every AUE, seek SE elements as defined in core concepts.<\/constraint>\n        <constraint>Intake is never gated or judged; only the resulting map may be graded and the intake refined contextually afterward.<\/constraint>\n    <\/constraints>\n    <completion_condition>\n    The task is complete when the final result is a minimal base shape of notable categorical elements of the artifact, joined by artifact-specific Operative Purposes, suitable for later expansion through project memory graph relations and other knowledge layers.\n  <\/completion_condition>\n    <response_protocol>\n        <instructions>\n            <instruction>result carries an id. This file never uses it internally \u2014 it exists so this result can later be pasted into digital-typology-expand.xml's canonical_input, whose deep_result links back via a matching ref. Generate it even though nothing in this file's own output points to it.<\/instruction>\n            <instruction>Respond with well-formed XML matching the schema below \u2014 no prose, no markdown, no commentary outside the XML. result is the document root \u2014 do not wrap it in any outer tag, including the process's own name or title.<\/instruction>\n            <instruction>Elements and joins express the final annealed shape after Method step 11. Keep the root element list minimal, coarse, and shallow per Goal and Constraints by absorbing subparts. Do not emit absorbed subparts as independent root elements; instead, preserve their atomic realities exclusively as nested join subtypes inside the load-bearing parent's matching purpose join.<\/instruction>\n            <instruction>An element's identity is its namespace_address attribute, not its readable name. \"tool registry\" is prose; code.registry.tool is the element. Any reference to an element, in a join or anywhere else, must use that namespace_address value, never the name alone. A name with no matching namespace_address isn't a valid reference to anything.<\/instruction>\n            <instruction>All namespace records are elements. An element inside the AUE carries exactly one role of DE, SE, or NE. A VE outside the AUE is represented as an element with role VE; it does not receive an AUE role of DE, SE, or NE. PE is not a role attribute: it is the join's other endpoint. The same element may bear an OP as a VRE in one join and provide an EF as a PE in another without duplication.<\/instruction>\n            <instruction>Joins connect the VRE bearing the OP to the PE providing for it, and carry purpose, function, relation in active voice, observation of the actual real-world condition, format, layout, or limitations of what is there, optional non_goal, and refs where required. This applies to every join.<\/instruction>\n            <instruction>Include refs on a join only when it needs type-specific or artifact-specific references or logic beyond purpose, function, relation, observation, or non_goal.<\/instruction>\n            <instruction>non_goal is optional and records a pertinent outcome the VRE does not seek where it materially clarifies the OP. Omit it when it does not apply.<\/instruction>\n        <\/instructions>\n        <schema>\n            <result id=\"[generated result id]\">\n                <elements>\n                    <!-- All namespace records remain elements -->\n                    <element namespace_address=\"[dotted namespace address]\" name_length=\"[proper_noun_lookback_segment_count]\" role=\"[AUE|VE|DE|SE|NE]\">\n                        <!-- Informal Name -->\n                        <name/>\n                        <joins>\n                            <join type=\"purpose\" provider=\"[namespace address of the Providing Element]\" purpose=\"[State the intended goal, standard, or reason why this element or action is needed.]\" function=\"[Encounter Function of the Providing Element serving this VRE's OP]\" relation=\"[active-voice relation]\" observation=\"[State the actual real-world condition, format, layout, or limitations of what is there.]\" non_goal=\"[State what this element or action is explicitly NOT trying to do, fix, or include.]\">\n                                <refs>\n                                    <!-- Uniform dictionary shape for type-specific or artifact-specific keys -->\n                                    <ref key=\"[key]\" value=\"[value]\" />\n                                <\/refs>\n                                <!-- Internal subtype join: no purpose, the parent join carries it -->\n                                <join provider=\"[namespace address of the absorbed subtype]\" function=\"[Encounter Function of the subtype within the parent]\" relation=\"[active-voice relation of the subtype]\" observation=\"[State the actual real-world condition, format, layout, or limitations of the subtype.]\">\n                                    <element namespace_address=\"[dotted namespace address]\" name_length=\"[proper_noun_lookback_segment_count]\" role=\"[DE|SE|NE]\">\n                                        <name/>\n                                        <refs>\n                                            <!-- Uniform dictionary shape for type-specific or artifact-specific keys -->\n                                            <ref key=\"[key]\" value=\"[value]\" />\n                                        <\/refs>\n                                    <\/element>\n                                <\/join>\n                            <\/join>\n                        <\/joins>\n                    <\/element>\n                <\/elements>\n            <\/result>\n        <\/schema>\n    <\/response_protocol>\n<\/process>\n", "saved": "2026-09-24 19:51"}]}, {"id": "practices", "name": "Best practices per join", "versions": [{"v": 1, "saved": "2026-09-23 18:02", "text": "# Best practices per join\n\nFor every join in the metaform, write the practices a worker changing MGM must follow there.\n\n- Target the join itself: its receiver address and its provider.\n- Give each practice an imperative: must, must_not, should.\n- Tie each one to the designer's rules or a past fault, with the evidence.\n- Say how to check it.\n"}]}]};
const $ = s => document.querySelector(s);

/* ---------- 3D graph ---------- */
function graphData(){
  const nodes = [], links = [];
  for (const e of els) nodes.push({id:e.id, t:'el', name:e.name, role:e.role, flag:flagged[e.id]?.flag});
  const ids = new Set(els.map(e=>e.id));
  for (const e of els) {                 // namespace tree skeleton: nearest registered prefix
    const segs = e.id.split('.');
    for (let i = segs.length-1; i > 0; i--) {
      const pre = segs.slice(0,i).join('.');
      if (ids.has(pre)) { links.push({source:pre, target:e.id, k:'tree'}); break; }
    }
  }
  for (const j of joins) {               // each join uncollapsed: receiver → purpose → provider
    const pid = 'p:' + j.id;
    nodes.push({id:pid, t:'purpose', join:j.id, name:j.purpose});
    links.push({source:j.receiver, target:pid, k:'purpose', layer:'intake'});
    links.push({source:pid, target:j.provider, k:'encounter', layer:'intake'});
    if (on.practices) for (const [i,p] of (practicesByJoin[j.id]||[]).entries()) {
      const nid = 'k:' + j.id + ':' + i;
      nodes.push({id:nid, t:'practice', join:j.id, name:p.statement});
      links.push({source:pid, target:nid, k:'layer', layer:'practices'});
    }
  }
  if (on.memory) memories.forEach((m,i) => {
    nodes.push({id:'m:'+i, t:'memory', el:m.el, name:m.text});
    links.push({source:m.el, target:'m:'+i, k:'layer', layer:'memory'});
  });
  return {nodes, links};
}
const colorOf = n => n.t==='el' ? (n.flag==='broken'?css('--broken'):n.flag==='cruft'?css('--cruft'):n.role==='VE'?css('--signal'):n.role==='DE'?'#ffffff':css('--intake'))
  : n.t==='purpose' ? css('--text') : n.t==='practice' ? css('--practice') : css('--memory');
const linkColor = l => l.k==='tree' ? css('--tree') : l.layer==='practices' ? css('--practice') : l.layer==='memory' ? css('--memory') : l.k==='encounter' ? css('--signal') : css('--intake');

let G, selected = null;
function start3D(){
  if (typeof ForceGraph3D !== 'function') { $('#stage').innerHTML = '<p class="empty" style="padding:24px">The 3D view needs WebGL and could not start here.</p>'; return; }
  G = ForceGraph3D({controlType:'orbit'})($('#stage'))
    .backgroundColor(css('--ground'))
    .showNavInfo(false)
    .nodeRelSize(3)
    .nodeVal(n => n.t==='el' ? (n.role==='DE'?9:n.role==='VE'?7:4) : n.t==='purpose' ? 0.9 : 0.35)
    .nodeColor(n => selected && n.id!==selected && n.t==='el' && !neighbors.has(n.id) ? '#2b3644' : colorOf(n))
    .nodeOpacity(0.95)
    .nodeResolution(16)
    .nodeLabel(n => `<div style="font:12px IBM Plex Sans,sans-serif;max-width:280px;background:#0c1117ee;border:1px solid #2a3747;padding:6px 8px;border-radius:6px;color:#d9e2ec">${n.t==='el'?'<b>'+esc(n.name)+'</b><br><span style="font-family:IBM Plex Mono,monospace;color:#62e3d3">'+esc(n.id)+'</span>':esc((n.name||'').slice(0,220))}</div>`)
    .linkColor(linkColor)
    .linkOpacity(0.55)
    .linkWidth(l => l.k==='tree' ? 0.4 : l.k==='layer' ? 0.25 : 0.9)
    .linkCurvature(l => l.k==='layer' ? 0 : 0.18)
    .linkDirectionalParticles(l => l.k==='purpose' || l.k==='encounter' ? 2 : 0)
    .linkDirectionalParticleSpeed(0.006)
    .linkDirectionalParticleWidth(1.6)
    .linkDirectionalParticleColor(linkColor)
    .onNodeClick(n => {
      const target = n.t==='el' ? n.id : n.t==='purpose' ? joins.find(j=>j.id===n.join)?.receiver : n.t==='practice' ? joins.find(j=>j.id===n.join)?.receiver : n.el;
      if (target) select(target, true);
    })
    .graphData(graphData());
  G.d3Force('charge').strength(n => n.t==='el' ? -140 : -18);
  G.d3Force('link').distance(l => l.k==='layer' ? 8 : l.k==='tree' ? 60 : 34);
  resize();
  count();
  const box = $('#labels3d');
  const tags = new Map(els.map(e => { const s = document.createElement('span'); s.textContent = short(e.name, 26); box.append(s); return [e.id, s]; }));
  const tick = () => {
    const nodes = G.graphData().nodes;
    for (const n of nodes) {
      const s = tags.get(n.id); if (!s || n.x === undefined) continue;
      const p = G.graph2ScreenCoords(n.x, n.y, n.z);
      s.style.left = p.x + 'px'; s.style.top = p.y + 'px';
      s.className = n.id===selected ? 'sel' : neighbors.has(n.id) ? 'near' : selected ? 'dim' : '';
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
let neighbors = new Set();
function rebuild(){ if (G) { G.graphData(graphData()); count(); } }
function count(){
  const d = G ? G.graphData() : graphData();
  $('#count').textContent = `${els.length} elements · ${joins.length} joins · ${d.nodes.length} nodes shown`;
}
function resize(){ if (G) { const r = $('#stage').getBoundingClientRect(); G.width(r.width).height(r.height); } }
addEventListener('resize', resize);

$('#legend').innerHTML = [
  ['--intake','purpose · receiver to join'],['--signal','encounter · join to provider'],['--tree','namespace'],
  ['--practice','best practices layer'],['--memory','memory'],
].map(([c,t]) => `<span style="--c:var(${c})"><i></i>${t}</span>`).join('') +
  `<span style="--c:var(--broken)"><i class="dot"></i>flag: broken</span><span style="--c:var(--cruft)"><i class="dot"></i>flag: cruft</span>`;

/* ---------- selection and the 2D drill-in ---------- */
mermaid.initialize({startOnLoad:false, theme:'base', securityLevel:'strict', flowchart:{curve:'basis', htmlLabels:false},
  themeVariables:{background:'#06080c', primaryColor:'#111821', primaryBorderColor:'#2a3747', primaryTextColor:'#d9e2ec', lineColor:'#7fb0ff', fontFamily:'IBM Plex Sans, sans-serif', fontSize:'13px', edgeLabelBackground:'#06080c', tertiaryColor:'#0c1117'}});
let mcount = 0;
const mid = id => 'n' + id.replace(/[^a-zA-Z0-9]/g,'_');
const short = (s,n=46) => { s = String(s||'').replace(/["\[\]{}()<>|]/g,''); return s.length>n ? s.slice(0,n-1)+'…' : s; };
const M = {svg:null, nodes:new Map(), edges:[], cam:null, fitBox:null, frame:0};
async function build2D(){
  const lines = ['flowchart TB'];
  for (const e of els) lines.push(`${mid(e.id)}["${short(e.name,26)}"]`);
  joins.forEach(j => lines.push(`${mid(j.receiver)} --> ${mid(j.provider)}`));
  try {
    const {svg} = await mermaid.render('map2dsvg', lines.join('\n'));
    const host = $('#map2d'); host.insertAdjacentHTML('afterbegin', svg);
    M.svg = host.querySelector('svg'); M.svg.removeAttribute('style'); M.svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    for (const e of els) {
      const g = M.svg.querySelector(`g.node[id*="-${mid(e.id)}-"]`) || M.svg.querySelector(`g.node[id$="${mid(e.id)}"]`);
      if (!g) continue;
      const b = g.getBBox(), m = g.transform.baseVal.consolidate()?.matrix;
      const cx = (m ? m.e : 0) + b.x + b.width/2, cy = (m ? m.f : 0) + b.y + b.height/2;
      M.nodes.set(e.id, {g, x:cx, y:cy, w:b.width, h:b.height});
      g.style.cursor = 'pointer';
      g.addEventListener('click', ev => { ev.stopPropagation(); select(e.id, true); });
    }
    const paths = [...M.svg.querySelectorAll('.edgePaths path')];
    M.edges = joins.map((j,i) => ({j, path:paths[i]}));
    const vb = M.svg.viewBox.baseVal; M.fitBox = {x:vb.x, y:vb.y, w:vb.width, h:vb.height};
    M.cam = {...M.fitBox};
    wire2D();
    if (selected) focus2D(selected, false);
  } catch (err) { $('#map2d').insertAdjacentHTML('afterbegin', '<p class="empty" style="padding:16px">The map could not be drawn.</p>'); }
}
function aspect(){ const r = $('#map2d').getBoundingClientRect(); return Math.max(.2, r.width / Math.max(1, r.height)); }
function frameBox(b){ const a = aspect(); let {x,y,w,h} = b; if (w/h > a) { const nh = w/a; y -= (nh-h)/2; h = nh; } else { const nw = h*a; x -= (nw-w)/2; w = nw; } return {x,y,w,h}; }
function setCam(c){ M.cam = c; M.svg.setAttribute('viewBox', `${c.x} ${c.y} ${c.w} ${c.h}`); }
function moveCam(target, animate = true){
  cancelAnimationFrame(M.frame);
  const to = frameBox(target), from = {...M.cam};
  if (!animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return setCam(to);
  const t0 = performance.now(), dur = 700, ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
  const step = now => { const k = ease(Math.min(1,(now-t0)/dur)); setCam({x:from.x+(to.x-from.x)*k, y:from.y+(to.y-from.y)*k, w:from.w+(to.w-from.w)*k, h:from.h+(to.h-from.h)*k}); if (k<1) M.frame = requestAnimationFrame(step); };
  M.frame = requestAnimationFrame(step);
}
function fit2D(){ $('#map2d').classList.remove('focused'); M.edges.forEach(e => { e.path?.classList.remove('on'); }); for (const n of M.nodes.values()) n.g.classList.remove('sel','near'); moveCam(M.fitBox); }
function focus2D(id, animate = true){
  const n = M.nodes.get(id); if (!n || !M.svg) return;
  $('#map2d').classList.add('focused');
  for (const [k,v] of M.nodes) { v.g.classList.toggle('sel', k===id); v.g.classList.toggle('near', k!==id && neighbors.has(k)); }
  M.edges.forEach(e => { const touch = e.j.receiver===id || e.j.provider===id; e.path?.classList.toggle('on', touch); });
  const w = Math.max(n.w*3.4, 380), h = Math.max(n.h*5, 260);
  moveCam({x:n.x-w/2, y:n.y-h/2, w, h}, animate);
}
function arrowNav(ev){
  if (ev.key==='f' || ev.key==='F' || ev.key==='Home') { ev.preventDefault(); fit2D(); if (G) G.zoomToFit(700, 60); return; }
  const dirs = {ArrowRight:[1,0], ArrowLeft:[-1,0], ArrowDown:[0,1], ArrowUp:[0,-1]}; const d = dirs[ev.key];
  if (!d || !selected) return; ev.preventDefault();
  const from = M.nodes.get(selected); if (!from) return; let best = null, score = Infinity;
  for (const k of neighbors) { if (k===selected) continue; const n = M.nodes.get(k); if (!n) continue;
    const dx = n.x-from.x, dy = n.y-from.y, along = dx*d[0]+dy*d[1]; if (along <= 0) continue;
    const s = Math.hypot(dx,dy) * (1 + Math.abs(dx*d[1]-dy*d[0]) / (along+1)); if (s < score) { score = s; best = k; } }
  if (best) select(best, true);
}
document.addEventListener('keydown', ev => { if (ev.target.closest('.CodeMirror, select, input, textarea')) return; arrowNav(ev); });
function wire2D(){
  const host = $('#map2d');
  $('#fitBtn').onclick = ev => { ev.stopPropagation(); fit2D(); };
  let drag = null;
  host.addEventListener('pointerdown', ev => { if (ev.target.closest('button')) return; drag = {x:ev.clientX, y:ev.clientY, cam:{...M.cam}}; host.setPointerCapture(ev.pointerId); });
  host.addEventListener('pointermove', ev => { if (!drag) return; const r = host.getBoundingClientRect(), s = M.cam.w / r.width; setCam({...drag.cam, x:drag.cam.x-(ev.clientX-drag.x)*s, y:drag.cam.y-(ev.clientY-drag.y)*s}); });
  host.addEventListener('pointerup', () => drag = null);
  host.addEventListener('wheel', ev => { ev.preventDefault(); const f = ev.deltaY > 0 ? 1.15 : 0.87, r = host.getBoundingClientRect(), px = (ev.clientX-r.left)/r.width, py = (ev.clientY-r.top)/r.height, c = M.cam;
    setCam({x:c.x+(c.w-c.w*f)*px, y:c.y+(c.h-c.h*f)*py, w:c.w*f, h:c.h*f}); }, {passive:false});
}
function select(id, fly){
  selected = id;
  neighbors = new Set([id, ...joins.filter(j=>j.receiver===id).map(j=>j.provider), ...joins.filter(j=>j.provider===id).map(j=>j.receiver)]);
  if (G) {
    G.nodeColor(G.nodeColor());
    const n = G.graphData().nodes.find(x => x.id===id);
    if (fly && n && n.x!==undefined) {
      const d = 90, r = 1 + d/Math.hypot(n.x||1,n.y||1,n.z||1);
      G.cameraPosition({x:n.x*r, y:n.y*r, z:n.z*r}, n, 900);
    }
  }
  renderObject(id);
  focus2D(id, fly);
  showTab('object');
}
function renderObject(id){
  const e = byId[id]; if (!e) return;
  const f = flagged[id];
  const out = joins.filter(j => j.receiver===id), inn = joins.filter(j => j.provider===id);
  const mem = on.memory ? memories.filter(m => m.el===id) : [];
  $('#p-object').innerHTML = `
    <div class="eyebrow">Element</div>
    <h2>${esc(e.name)}</h2>
    <div class="addr">${esc(e.id)}</div>
    <div class="pills">${e.role?`<span class="pill">${esc(e.role)}</span>`:''}${f?`<span class="pill flag-${f.flag}" title="${esc(f.note)}">${f.flag}</span><span class="pill example">example flag</span>`:''}<span class="pill">${out.length} out · ${inn.length} in</span></div>
    ${f?`<p class="empty">${esc(f.note)}</p>`:''}
    ${e.notes?`<div class="eyebrow">Notes</div><p style="margin:0;color:var(--muted);font-size:13px">${esc(e.notes)}</p>`:''}
    ${mem.length?`<div class="eyebrow">Memory</div>${mem.map(m=>`<div class="memo">${esc(m.text)}</div>`).join('')}`:''}
    <div class="eyebrow">Joins held by this element</div>
    ${out.length?out.map(j=>joinCard(j,'to')).join(''):'<p class="empty">This element receives nothing.</p>'}
    ${inn.length?`<div class="eyebrow">Serves</div>${inn.map(j=>joinCard(j,'from')).join('')}`:''}`;
}
function joinCard(j, dir){
  const other = dir==='to' ? j.provider : j.receiver;
  const ps = on.practices ? (practicesByJoin[j.id]||[]) : [];
  return `<div class="join">
    <div class="row"><span class="dir">${dir==='to'?'provider':'receiver'} · <a href="#" data-go="${esc(other)}" style="color:var(--signal)">${esc(byId[other]?.name||other)}</a></span><span class="lay" style="--c:var(--intake)">intake map</span></div>
    <p>${esc(j.purpose)}</p>
    <p class="fn">${esc(j.function)}</p>
    ${ps.slice(0,3).map(p=>`<div class="practice"><b>${esc(p.imperative)}</b>${esc(p.statement)}</div>`).join('')}
    ${ps.length>3?`<p class="empty">${ps.length-3} more practices in this join</p>`:''}
  </div>`;
}
$('#p-object').addEventListener('click', ev => {
  const a = ev.target.closest('[data-go]'); if (a) { ev.preventDefault(); select(a.dataset.go, true); }
});

/* ---------- provenance ---------- */

  const p = l.prov;
  $('#p-prov').innerHTML = `
    <div class="eyebrow">Layers in this metaform</div>

    ${p ? `<dl class="prov">

      <dt>workflow</dt><dd>${esc(p.workflow)}</dd>
      <dt>prompt</dt><dd>${esc(DATA.prompts.find(x=>x.id===p.prompt)?.name)} · version ${p.version}</dd>
      <dt>model</dt><dd>${esc(p.model)}</dd>
