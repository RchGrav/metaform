    <p class="empty">Provenance points at the exact prompt version that made this layer. Editing the prompt makes a new version and leaves this record as it is.</p>`
    : `<p class="empty">Memory has no provenance. Agents edit it in place.</p>`}
    ${l.id!=='intake'&&l.kind!=='memory'?'<p class="empty">Model, role and dates for this layer are examples.</p>':''}`;
  $('#p-prov').querySelectorAll('.layerlist button').forEach(b => b.onclick = () => { provLayer = b.dataset.l; renderProv(); });
  const o = $('#openPrompt'); if (o) o.onclick = () => { openPrompt(p.prompt, p.version); showTab('prompt'); };
}

/* ---------- prompt editor ---------- */
const cm = CodeMirror.fromTextArea($('#editor'), {lineNumbers:true, lineWrapping:true, mode:'xml'});
let curPrompt = 'canonical-intake', curVer = 2;
function prompt(id){ return DATA.prompts.find(p => p.id===id); }
function fillPromptSel(){
  $('#promptSel').innerHTML = DATA.prompts.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  $('#promptSel').value = curPrompt;
  $('#verSel').innerHTML = prompt(curPrompt).versions.map(v=>`<option value="${v.v}">version ${v.v} · ${esc(v.saved)}</option>`).join('');
  $('#verSel').value = curVer;
}
function openPrompt(id, v){
  curPrompt = id; curVer = v; fillPromptSel();
  const ver = prompt(id).versions.find(x => x.v===v);
  cm.setOption('mode', ver.text.trimStart().startsWith('<') ? 'xml' : 'markdown');
  cm.setValue(ver.text); cm.clearHistory();
  $('#diffOut').hidden = true;
  const used = LAYERS.filter(l => l.prov && l.prov.prompt===id && l.prov.version===v).map(l=>l.name);
  $('#promptNote').textContent = used.length ? `Version ${v} made: ${used.join(', ')}.` : `No layer was made with version ${v}.`;
  setTimeout(() => cm.refresh(), 0);
}
$('#promptSel').onchange = () => { const p = prompt($('#promptSel').value); openPrompt(p.id, p.versions.at(-1).v); };
$('#verSel').onchange = () => openPrompt(curPrompt, +$('#verSel').value);
function lineDiff(a, b){
  a = a.split('\n'); b = b.split('\n');
  const n = a.length, m = b.length;
  if (n*m > 4e6) return [{t:'gap', s:'Too large to compare here.'}];
  const dp = Array.from({length:n+1}, () => new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out = []; let i=0,j=0;
  while (i<n && j<m) { if (a[i]===b[j]) { out.push({t:'same',s:a[i]}); i++; j++; } else if (dp[i+1][j]>=dp[i][j+1]) out.push({t:'del',s:a[i++]}); else out.push({t:'add',s:b[j++]}); }
  while (i<n) out.push({t:'del',s:a[i++]}); while (j<m) out.push({t:'add',s:b[j++]});
  const keep = new Set();
  out.forEach((r,k) => { if (r.t!=='same') for (let d=-2; d<=2; d++) keep.add(k+d); });
  const res = []; let skipped = false;
  out.forEach((r,k) => { if (keep.has(k)) { res.push(r); skipped = false; } else if (!skipped) { res.push({t:'gap', s:'···'}); skipped = true; } });
  return res;
}
$('#diffBtn').onclick = () => {
  const base = prompt(curPrompt).versions.find(x => x.v===curVer).text;
  const rows = lineDiff(base, cm.getValue());
  const changed = rows.some(r => r.t==='add' || r.t==='del');
  $('#diffOut').innerHTML = changed ? rows.map(r => `<div class="${r.t}">${r.t==='add'?'+ ':r.t==='del'?'- ':'  '}${esc(r.s)}</div>`).join('') : '<div class="gap">No changes from version ' + curVer + '.</div>';
  $('#diffOut').hidden = false;
};
$('#saveBtn').onclick = () => {
  const p = prompt(curPrompt), base = p.versions.find(x => x.v===curVer).text, text = cm.getValue();
  if (text === base) { toast('Nothing to save. The text matches version ' + curVer + '.'); return; }
  const v = p.versions.at(-1).v + 1;
  p.versions.push({v, text, saved: new Date().toISOString().slice(0,16).replace('T',' ')});
  openPrompt(p.id, v);
  toast(`Saved as version ${v}. Layers made with earlier versions still point to the version that made them.`);
};

/* ---------- corrections ---------- */
let pendingPeel = false;
function renderCorr(){
  $('#p-corr').innerHTML = `
    <div class="eyebrow">Correction stack · applied in order, newest on top</div>
    <p class="empty" style="margin:0">Correction layers always apply and cannot be toggled. Only the top one can be removed.</p>
    <div class="stack">${corrections.length ? corrections.map((c,i)=>`
      <div class="lyr ${i===0?'top':''}">
        <div class="row" style="display:flex;justify-content:space-between;gap:8px"><b>${esc(c.name)}</b><span class="meta">${esc(c.when)}</span></div>
        <div class="meta">${c.changes.map(x=>esc(x.op+' '+x.what+(x.to?' → '+x.to:''))).join('<br>')}</div>
        <div style="font-size:13px;color:var(--muted)">${esc(c.reason)}</div>
        ${i===0 && !pendingPeel ? '<div><button class="btn danger" id="peel">Remove this layer</button></div>' : ''}
      </div>`).join('') : '<p class="empty">No correction layers. The metaform reads as the intake left it.</p>'}
    </div>
    ${pendingPeel ? `<div class="warn">
      <b>Remove ${esc(corrections[0].name)}?</b>
      <span>This changes the metaform everyone reads:</span>
      <ul>${corrections[0].changes.map(x=>`<li>${x.op==='relocate'?esc(x.to)+' moves back to '+esc(x.what)+', and the joins the move removed come back':'the '+esc(x.what)+' it added is removed'}</li>`).join('')}
      <li>items in knowledge layers attached to what changes follow it or become orphaned</li></ul>
      <div class="toolbar"><button class="btn danger" id="peelYes">Remove it</button><button class="btn" id="peelNo">Keep it</button></div>
    </div>` : ''}
    <p class="empty">These correction layers are examples.</p>`;
  const p = $('#peel'); if (p) p.onclick = () => { pendingPeel = true; renderCorr(); };
  const y = $('#peelYes'); if (y) y.onclick = () => { const c = corrections.shift(); pendingPeel = false; LAYERS.splice(LAYERS.findIndex(l=>l.id===c.id),1); renderCorr(); renderChips(); toast(c.name + ' removed. The one below it is now on top.'); };
  const n = $('#peelNo'); if (n) n.onclick = () => { pendingPeel = false; renderCorr(); };
}

/* ---------- tabs, toast ---------- */
const TABS = {object:'#p-object', prov:'#p-prov', prompt:'#p-prompt', corr:'#p-corr'};
function showTab(t){
  for (const [k,sel] of Object.entries(TABS)) { $(sel).hidden = k!==t; $('#t-'+k).setAttribute('aria-selected', k===t); }
  if (t==='prompt') setTimeout(() => cm.refresh(), 0);
  if (t==='prov') renderProv();
  if (t==='corr') renderCorr();
}
for (const k of Object.keys(TABS)) $('#t-'+k).onclick = () => showTab(k);
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 4200); }

/* ---------- start ---------- */
renderChips();
fillPromptSel(); openPrompt('canonical-intake', 2);
const de = els.find(e => e.role==='DE') || els[0];
start3D();
select(de.id, false);
build2D();
setTimeout(() => { if (G) G.zoomToFit(800, 60); }, 2200);
</script>
