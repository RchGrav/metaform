:root{
  color-scheme:dark;
  --ground:#06080c; --panel:#0c1117; --panel-2:#111821; --line:#1d2733; --line-2:#2a3747;
  --text:#d9e2ec; --muted:#8395a8; --faint:#56667a;
  --signal:#62e3d3;
  --intake:#7fb0ff; --practice:#f2b35b; --memory:#c792ff; --correction:#ff7a6b; --tree:#3a4a5e;
  --missing:#ffd166; --broken:#ff5d73; --cruft:#9aa3ad;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--text);font:14px/1.5 var(--sans);margin:0}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(360px,440px) 1fr;grid-template-areas:"top top" "side stage"}
header{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:600 18px/1 var(--cond);letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}
.brand b{color:var(--signal)}
.brand small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.ctx{display:flex;gap:8px;align-items:center;font:12px var(--mono);color:var(--muted)}
.ctx select{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:4px 8px}
.layers{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line-2);border-radius:999px;background:transparent;cursor:pointer;font-size:12px;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.chip[disabled]{cursor:default;opacity:.9}
.apply{padding:5px 12px;border-radius:6px;border:1px solid var(--signal);background:transparent;color:var(--signal);cursor:pointer;font-size:12px}
.apply[disabled]{opacity:.35;cursor:default}
.note{flex-basis:100%;font-size:12px;color:var(--faint);margin:-4px 0 0}
aside{grid-area:side;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px 4px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font:500 12px var(--sans);letter-spacing:.06em;text-transform:uppercase}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--signal)}
.pane{flex:1;overflow:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
h2{font:600 20px/1.25 var(--cond);margin:0;text-wrap:balance}
.addr{font:12px var(--mono);color:var(--signal);word-break:break-all}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:500 11px var(--mono);padding:2px 8px;border-radius:4px;border:1px solid var(--line-2);color:var(--muted)}
.pill.flag-broken{color:var(--broken);border-color:var(--broken)}
.pill.flag-cruft{color:var(--cruft);border-color:var(--cruft)}
.pill.flag-missing{color:var(--missing);border-color:var(--missing)}
.pill.example{color:var(--faint);border-style:dashed}
.map2d{position:relative;height:clamp(240px,38vh,380px);border-bottom:1px solid var(--line);background:var(--ground);overflow:hidden;flex:none}
.map2d svg{position:absolute;inset:0;width:100%;height:100%;max-width:none!important;cursor:grab}
.map2d:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.map2d .node rect{fill:var(--panel-2)!important;stroke:var(--line-2)!important;rx:6px;transition:stroke .3s,fill .3s,opacity .3s}
.map2d .node .nodeLabel,.map2d .node text{fill:var(--text)!important;font:500 12px var(--sans)!important}
.map2d .node.sel rect{fill:#10303a!important;stroke:var(--signal)!important;stroke-width:2px!important}
.map2d .node.near rect{stroke:var(--intake)!important}
.map2d.focused .node:not(.sel):not(.near){opacity:.28}
.map2d .edgePaths path{stroke:var(--line-2)!important;stroke-width:1.2px!important;transition:stroke .3s,opacity .3s}
.map2d .edgePaths path.on{stroke:var(--intake)!important;stroke-width:1.8px!important}
.map2d.focused .edgePaths path:not(.on){opacity:.18}
.map2d marker path{fill:var(--line-2)!important;stroke:none!important}
.map2d .edgeLabel{opacity:0;transition:opacity .35s}
.map2d .edgeLabel.on{opacity:1}
.map2d .edgeLabel rect,.map2d .edgeLabel .label-container{fill:var(--ground)!important;opacity:.9}
.map2d .edgeLabel text,.map2d .edgeLabel tspan{fill:var(--muted)!important;font:11px var(--sans)!important}
.map2d .kbd{position:absolute;left:10px;bottom:8px;font:11px var(--mono);color:var(--faint);pointer-events:none}
.map2d .mapbtns{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.map2d .mapbtns button{background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;padding:2px 8px;cursor:pointer;font:12px var(--mono);color:var(--muted)}
.join{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.join .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.join .dir{font:12px var(--mono);color:var(--muted)}
.join p{margin:0;color:var(--text)}
.join .fn{color:var(--muted);font-size:13px}
.join .lay{font:11px var(--mono);color:var(--c)}
.practice{font-size:13px;color:var(--muted);border-left:2px solid var(--practice);padding-left:8px}
.practice b{font:500 11px var(--mono);color:var(--practice);text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.memo{font-size:13px;border-left:2px solid var(--memory);padding-left:8px;color:var(--muted)}
dl.prov{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:13px}
dl.prov dt{color:var(--muted);font:12px var(--mono)}
dl.prov dd{margin:0}
.layerlist{display:grid;gap:6px}
.layerlist button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel-2);cursor:pointer;text-align:left}
.layerlist button[aria-pressed="true"]{border-color:var(--c)}
.layerlist .sw{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.btn{padding:6px 12px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;font-size:13px}
.btn.primary{border-color:var(--signal);color:var(--signal)}
.btn.danger{border-color:var(--correction);color:var(--correction)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.CodeMirror{height:340px;border:1px solid var(--line);border-radius:6px;font:12.5px/1.5 var(--mono);background:var(--ground);color:var(--text)}
.CodeMirror-gutters{background:var(--panel);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--faint)}
.CodeMirror-cursor{border-left-color:var(--signal)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:#1c3a44}
.cm-tag{color:var(--intake)}.cm-attribute{color:var(--practice)}.cm-string{color:#9fe0b8}.cm-comment{color:var(--faint)}.cm-header{color:var(--signal)}.cm-bracket{color:var(--muted)}
.diff{font:12px/1.5 var(--mono);background:var(--ground);border:1px solid var(--line);border-radius:6px;max-height:300px;overflow:auto;padding:8px 0;white-space:pre-wrap;word-break:break-word}
.diff div{padding:0 10px}
.diff .add{background:#12301f;color:#9fe0b8}.diff .del{background:#3a1519;color:#ffa3ad}.diff .gap{color:var(--faint)}
.stack{display:grid;gap:8px}
.stack .lyr{border:1px solid var(--line-2);border-radius:6px;padding:10px;background:var(--panel-2);display:grid;gap:4px}
.stack .lyr.top{border-color:var(--correction)}
.stack .meta{font:12px var(--mono);color:var(--muted)}
.warn{border:1px solid var(--correction);border-radius:6px;padding:12px;background:color-mix(in srgb,var(--correction) 8%,transparent);display:grid;gap:8px;font-size:13px}
.warn ul{margin:0;padding-left:18px}
main{grid-area:stage;position:relative;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0}
.legend{position:absolute;left:14px;bottom:14px;display:grid;gap:4px;font:11px var(--mono);color:var(--muted);background:color-mix(in srgb,var(--ground) 80%,transparent);padding:10px 12px;border:1px solid var(--line);border-radius:8px;pointer-events:none}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:18px;height:2px;background:var(--c);display:inline-block}
.legend i.dot{width:8px;height:8px;border-radius:50%}
 #labels3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels3d span{position:absolute;transform:translate(-50%,-160%);font:500 11px var(--sans);color:var(--muted);white-space:nowrap;text-shadow:0 0 6px var(--ground),0 0 2px var(--ground);transition:color .3s,opacity .3s}
#labels3d span.near{color:var(--text)}
#labels3d span.sel{color:var(--signal);font-size:13px;font-weight:600}
#labels3d span.dim{opacity:.35}
.hint{position:absolute;right:14px;top:12px;font:11px var(--mono);color:var(--faint);pointer-events:none}
.count{position:absolute;right:14px;bottom:14px;font:11px var(--mono);color:var(--muted);pointer-events:none;text-align:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--signal);color:var(--text);padding:10px 16px;border-radius:8px;font-size:13px;max-width:min(560px,calc(100% - 32px));box-shadow:0 8px 30px #0008}
.empty{color:var(--faint);font-size:13px}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 56vh auto;grid-template-areas:"top" "stage" "side";height:auto;min-height:100%}
  aside{border-right:0;border-top:1px solid var(--line)}
  .layers{margin-left:0}
  header{padding:12px 16px}
  .pane{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand"><span>m<b>form</b></span><small>viewer</small></div>
    <div class="ctx">
      <label for="proj">project</label>
      <select id="proj"><option>mgm-main</option></select>
      <label for="mf">metaform</label>
      <select id="mf"><option>main</option></select>
    </div>
    <div class="layers" id="layers" role="group" aria-label="Layers shown in this view"></div>
    <button class="apply" id="apply" disabled title="Runs metaform set --layers for this folder">Apply to folder</button>
    <p class="note" id="note">Viewing only. What you toggle here changes this view, not the folder, until you apply it.</p>
  </header>

  <aside>
    <div class="map2d" id="map2d" tabindex="0" aria-label="Map of joins. Arrow keys move to a connected element; F fits the whole map."><div class="mapbtns"><button id="fitBtn" title="Fit the whole map (F)">Fit</button></div><span class="kbd">click or use arrows to move · F fits</span></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-object" aria-selected="true">Object</button>
      <button role="tab" id="t-prov" aria-selected="false">Provenance</button>
      <button role="tab" id="t-prompt" aria-selected="false">Prompt</button>
      <button role="tab" id="t-corr" aria-selected="false">Corrections</button>
    </div>
    <section class="pane" id="p-object"></section>
    <section class="pane" id="p-prov" hidden></section>
    <section class="pane" id="p-prompt" hidden>
      <div class="toolbar">
        <select id="promptSel" aria-label="Prompt"></select>
        <select id="verSel" aria-label="Version"></select>
        <button class="btn" id="diffBtn">Show changes</button>
        <button class="btn primary" id="saveBtn">Save as new version</button>
      </div>
      <textarea id="editor"></textarea>
      <div id="diffOut" class="diff" hidden></div>
      <p class="empty" id="promptNote"></p>
    </section>
    <section class="pane" id="p-corr" hidden></section>
  </aside>

  <main>
    <div id="stage" aria-label="3D map of the metaform" tabindex="0"></div>
    <div id="labels3d" aria-hidden="true"></div>
    <div class="hint">drag to orbit · scroll to zoom · click a node</div>
    <div class="legend" id="legend"></div>
    <div class="count" id="count"></div>
  </main>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const DATA = {"elements": [{"id": "stakeholder.operator.mesh", "name": "Mesh operator", "role": "VE", "notes": "Deploys OpenWrt nodes running MGM across a site, on x86_64, TP-Link EAP615 wall access points or Raspberry Pi 4, wires uplinks into some of them, and serves clients on every node. Installs the packages, reads node state, and acts only when something looks wrong. Chosen over the clients on the nodes, who use the internet but do nothing with the artifact, and over the people building MGM, whose stake is in the development work rather than in the running mesh. Surveyed at main 43a8cf5, whose code equals checkpoint 80a8407.", "refs": ["mesh-gateway-manager", "ipgen", "autoap", "mgm-config", "pi-demo", "docs", "README.md", "43a8cf5 on main, code identical to checkpoint 80a8407"]}, {"id": "code.manager.gateway.mesh", "name": "mgmd, the MGM daemon", "role": "DE", "notes": "One process on one uloop, started by procd. Defining element: without it the package set no longer manages mesh gateways. Compiled from mesh-gateway-manager/src plus core/firewall, metrics, multicast, routing, sentry and throughput. Compiled but unreached at 43a8cf5: core_remote_broadcast_cb and the INBOUND_MESSAGE_FROM_REMOTE_NODE path, mgm_unknown_node_track, the REBROADCAST_COALESCE emitter, glue_handle_sentry_event, the Sentry LED script output, the quorum JSON control plane, json_originators and jsmn, batadv_nl.c, and the dead fw4-reload broadcast path. mgm_packet_v2.h and mgm_discovery.h", "refs": ["mesh-gateway-manager/core/multicast", "mesh-gateway-manager/core/multicast/src/mgm_multicast.c mgm_multicast_init, send_status_now", "mesh-gateway-manager/src/core_adapter.c core_multicast_rebind", "mesh-gateway-manager/core/multicast/src/mgm_cbor.c", "mesh-gateway-manager/core/multicast/src/mgm_multicast.c mgm_should_bump_sequence, mgm_update_local_state, mgm_force_status_broadcast_with_reason", "mesh-gateway-manager/core/multicast/src/mgm_multicast.c process_parsed_status", "mesh-gateway-manager/src/convergence_loop.c", "mesh-gateway-manager/src/mgm.c convergence wiring"]}, {"id": "code.protocol.witness.state", "name": "MGM sender-scoped state witness protocol", "role": "SE", "notes": "Code at 43a8cf5 matches PROTOCOL.md's receive algorithm and convergence loop. Differences found: the store overwrites a record even when the token is equal; the 1 s reply is a trailing debounce that forced broadcasts do not cancel; the returning-remote trigger is undocumented. Open defect since 2026-07-09: map_remove leaves tombstones that map_find never reuses and the rehash does not count, so repeated purge and return exhausts the 64-slot table and map_put dereferences NULL in mgm_store_upsert_remote.", "refs": ["mesh-gateway-manager/core/throughput/src/batadv_query.c", "mesh-gateway-manager/src/core_adapter.c core_refresh_primary_route_if_changed", "mesh-gateway-manager/src/core_adapter.c core_query_primary_route", "mesh-gateway-manager/core/multicast/src/mgm_multicast.c mgm_update_primary_route", "mesh-gateway-manager/src/glue_openwrt.c glue_refresh_identity", "mesh-gateway-manager/src/core_adapter.c detect_batman_ifname", "mesh-gateway-manager/src/mgm.c get_mesh_master_ifname, discover_mesh_ifname_sysfs", "mesh-gateway-manager/src/mgm_mnemonic.c"]}, {"id": "code.manager.route", "name": "MGM route manager", "role": "SE", "notes": "Four layers: route_manager.c consumes events, core_adapter wraps them as verb requests, mgm_route.c runs the verbs, route_lib.c talks netlink. Peer timeout and carrier loss use DELETE, which never repacks, although CLAUDE.md says peer timeout ejects and repacks. DELETE always filters by the mesh_bridge ifindex, so a carrier-loss DELETE for a local uplink on another device matches nothing, inferred from code and not run.", "refs": ["mesh-gateway-manager/src/core_adapter.c core_process_inbound_state", "mesh-gateway-manager/core/multicast/src/mgm_state.c", "mesh-gateway-manager/src/originator_timeout.c", "mesh-gateway-manager/src/core_adapter.c reconcile, maybe_emit_originator_trigger_broadcast", "a node that was a remote, went out of range past the threshold and returns triggers a broadcast; a batman originator that never became a remote is not a trigger, stated by the designer 2026-09-21", "mesh-gateway-manager/src/core_adapter.c update_throughput_ranker_from_batman", "mesh-gateway-manager/core/routing/src/route_lib.c make_route, replace_route_tx"]}, {"id": "code.tester.uplink", "name": "Sentry direct-uplink tester", "role": "SE", "notes": "Embedded in mgmd since commit d798ef0 replaced the standalone C3ACT. Uses subprocesses, fork and exec of dnsbench, which CLAUDE.md forbids in general. sentry_engine_start blocks the main thread for 50 ms. The explicit per-interval penalty list is never filled. Sentry LED scripts have no production consumer.", "refs": ["mesh-gateway-manager/core/sentry/files/etc/config/sentry", "mesh-gateway-manager/core/sentry/src/netlink.c", "mesh-gateway-manager/core/sentry/src/sentry_ubus.c act_engine_setup"]}, {"id": "code.failsafe.gateway.mesh", "name": "Mesh safety net, SafeNet", "role": "SE", "notes": "The only permitted periodic transmitter, restored 2026-09-14. At 43a8cf5 a trip sends a bumped broadcast, as PROTOCOL.md says; the designer stated on 2026-09-21 that a SafeNet trip must not broadcast, and that change sits on branch preserve/2026-09-21-rediscovery-online-safenet. OPERATIONS.md says an empty probe_targets list disables SafeNet, but the loader substitutes 8.8.8.8 and 1.1.1.1.", "refs": ["mesh-gateway-manager/src/mgm.c SafeNet gateway lookup", "mesh-gateway-manager/src/mgm.c mgm_safetynet_on_trip", "mesh-gateway-manager/src/glue_openwrt.c load_safetynet_probe_targets"]}, {"id": "code.identity.node", "name": "Node identity and mesh placement", "role": "SE", "notes": "The batman sysfs check has no netlink fallback in this tree, although project memory records one from February 2026. mgmd reads hostname once while it is empty, so with pi-demo's hostname=1 the kernel hostname can already be the mnemonic when mgmd starts, inferred and not run.", "refs": ["ipgen", "ipgen/src/ipgen.c", "ipgen/files/lib/netifd/proto/ipgen.sh", "ipgen/root/www/luci-static/resources/protocol/ipgen.js", "ipgen/files/etc/uci-defaults/50-ipgen-proto", "mesh-gateway-manager/src/core_adapter.c", "mesh-gateway-manager/Makefile postinst"]}, {"id": "code.generator.address.mesh", "name": "ipgen deterministic mesh IP provider", "role": "SE", "notes": "Separate package, release 26.07.23.1, binary /usr/bin/ipgen. Image or profile composition provides it; mgmd does not depend on it. After 10 conflicts every exhausted node takes the same address, network OR total minus 2.", "refs": ["ipgen/files/lib/netifd/proto/ipgen.sh"]}, {"id": "code.manager.firewall", "name": "MGM firewall manager", "role": "SE", "notes": "Not init-only: it re-enforces and reloads fw4 at run time on interface events, external reloads and a 300 ms retry. It classifies the mesh by device name, bat, br-mesh or mesh, and treats a gateway inside a hard-coded 10.128.0.0/16 as indirect. It never calls getifaddrs, and no revision in history did. It does not touch net.ipv4.ip_forward. The UCI include section persists in /etc/config/firewall after stop.", "refs": ["mesh-gateway-manager/core/firewall/src/mgm_firewall.c"]}, {"id": "code.interface.operator", "name": "MGM operator interface", "role": "SE", "notes": "The rpcd ACL grants likely nothing, since its top-level key is acl rather than a group name, and it omits rank, list, remotes, mgm.batadv and sentry. mgm led calls a method mgmd does not register. mgm debug peers and routes need jq, which no package list ships. No luci-app-mgm exists in this tree.", "refs": ["mesh-gateway-manager/files/usr/share/rpcd/acl.d/mgm.json"]}, {"id": "code.provisioner.mesh", "name": "MGM mesh provisioning packages", "role": "SE", "notes": "Config-only packages, no compiled daemon. mgm-config is excluded from the EAP615 profile because C3Lab's overlay supplies the shared-br-lan provisioning and 99-mgm-eap615-mesh-l3. On first boot 90-mgm-config runs after 50-ipgen-proto and overrides its static fallback with proto ipgen, leaving the static ipaddr unused, inferred from ordering.", "refs": ["autoap", "autoap/src/autoapd.c", "autoap/files/lib/netifd/proto/autoap.sh", "autoap/src/autoapd.c", "autoap/src/autoapd.c", "mgm-config/files/etc/uci-defaults/90-mgm-config", "mgm-config/files/etc/config/mgm-config"]}, {"id": "code.fallback.dhcp", "name": "autoap DHCP-client and fallback-AP provider", "role": "SE", "notes": "Runtime package, release 26.04.07.1, in the runtime set for every profile but used only by pi-demo. Its 2 s and 5 s re-evaluation timer is polling alongside the event triggers. The LuCI status view calls autoap.IFACE status, but the ACL grants no ubus access.", "refs": ["autoap/files/usr/lib/autoap/udhcpc.sh"]}, {"id": "document.guide.operator", "name": "MGM operator and repository guide", "role": "SE", "notes": "OPERATIONS.md omits mgm.debug.history_limit and mgm.core.mesh_hardif, and says mgmd adds the addnhosts entry, which init.d and postinst do. README.md lists five packages while packages/manifest.txt still lists c3act.", "refs": []}, {"id": "code.protocol.routing.mesh", "name": "batman-adv, BATMAN_V", "role": "NE", "notes": "External kernel module kmod-batman-adv with batctl-full. MGM demands a bat device bridged into mesh_bridge, link-local multicast flooding across it, and the generic-netlink originator, mesh and hardif dumps. MGM does not use batman gateway mode or BATADV_CMD_GET_GATEWAYS.", "refs": []}, {"id": "code.system.operating", "name": "OpenWrt 24.10 with its Linux kernel", "role": "NE", "notes": "Package dependencies of mesh-gateway-manager: libubox, libubus, libnl-core, libnl-genl, libnl-route, libjson-c, libuci, rpcd, firewall4, libmnl, libnftnl, libsodium, libgpiod, libcbor.", "refs": []}, {"id": "code.resolver.recursive", "name": "Public recursive DNS resolvers", "role": "NE", "notes": "8.8.8.8 and 1.1.1.1 for SafeNet, and the dnsbench-ranked pool or the builtin 250-entry list for Sentry. Both testers decide internet reachability by whether these answer.", "refs": []}], "joins": [{"receiver": "stakeholder.operator.mesh", "provider": "code.manager.gateway.mesh", "purpose": "Give the clients on every node of the operator's batman-adv mesh internet access through whichever uplinks are working, wired, wireless or cellular, on any node, and keep it working when an uplink or a node fails or returns, with no per-node addressing, no per-node routes and no hand failover.", "function": "mgmd advertises its own active, online and direct flags and primary uplink over bridge-bound IPv6 multicast only when they change, records each peer's self-advertised state, and turns Sentry's direct-uplink verdicts and peers' gateway states into IPv4 default routes packed by metric class in the kernel main table, so the lowest metric is always a working uplink.", "relation": "The mesh gateway manager delivers mesh-wide internet egress to the mesh operator.", "observation": "A mesh gateway manager decides which gateway each mesh node uses to reach networks outside the mesh.", "id": "j0"}, {"receiver": "stakeholder.operator.mesh", "provider": "code.interface.operator", "purpose": "See at a glance which nodes are on the mesh, which uplink each one is using and at what metric, and act by hand when a node misbehaves: rebroadcast, sync, rebind multicast, align or eject a route.", "function": "mgmd serves the ubus objects mgm, mgm.route and mgm.batadv. The CLIs mgm, mgm-cli, mgmctl and nodelist wrap them, a login script prints every node's hostname, mnemonic, IP and metric, and Raspberry Pi builds show uplink and mesh state on two bicolor GPIO LEDs. mgm-ready-observe reports when a node has joined.", "relation": "The operator interface exposes mgmd's state and controls to the mesh operator.", "observation": "An operator interface lets a person observe and change a running system.", "id": "j1"}, {"receiver": "stakeholder.operator.mesh", "provider": "document.guide.operator", "purpose": "Pick the right packages for each node's hardware, know which of the shipped UCI options mgmd actually reads, and read a node's routes, metrics, remotes and Sentry state correctly when a node misbehaves.", "function": "README.md names the five packages and the three profiles, x86_64-generic, tplink_eap615-wall-v1 and rpi-4. PACKAGES.md maps each package's payload and dependencies and says ipgen is an image choice, not an mgmd dependency. OPERATIONS.md tables every shipped mgm option as live or inert, lists the mgm, mgm.route, mgm.batadv and sentry ubus methods and the CLI commands, and gives the EAP615 shared-br-lan provisioning steps. The reference documents explain what the operator sees on a running node.", "relation": "The operator guide tells the mesh operator how MGM is installed, configured and read.", "observation": "An operator guide explains how to install, configure and inspect a system.", "id": "j2"}, {"receiver": "stakeholder.operator.mesh", "provider": "code.provisioner.mesh", "purpose": "Bring each new node onto the mesh from its image, with bat0 bridged into br-mesh, a deterministic mesh_l3 address and mgm.core names pointing at them, without configuring nodes one by one.", "function": "90-mgm-config writes bat0 as batadv BATMAN_V with multicast_mode 1, bridge_loop_avoidance 1 and gw_mode off, br-mesh with bat0 as its port, mesh_l3 on br-mesh with proto ipgen, dhcp.mesh ignore, and sets mgm.core mesh_ifname, mesh_bridge and mesh_l3_ifname. pi-demo's 99-pi-demo builds the same stack over an IBSS radio for a Raspberry Pi 4. The EAP615 shared-br-lan shape comes from a C3Lab package overlay outside this tree.", "relation": "The mesh provisioner builds the mesh stack each node's mgmd attaches to.", "observation": "A mesh provisioner writes the configuration that brings a node's mesh interfaces up.", "id": "j3"}, {"receiver": "code.manager.gateway.mesh", "provider": "code.protocol.witness.state", "purpose": "Tell every peer on br-mesh this node's own active, online and direct flags and primary uplink, and learn each peer's, without acknowledgements and with no traffic once the mesh agrees.", "function": "Each broadcast is a CBOR map of the sender's own node state plus other_nodes, a sorted array of FNV-1a 32-bit witnesses over sender MAC, peer MAC and the peer's alert_mono_ns. A receiver records the sender first, then stays silent if its own expected witness is present, or else sends one no-bump rebroadcast after a 1000 ms coalesce. The token advances only when active, online, direct or the primary uplink name changes, or on a forced broadcast.", "relation": "The state witness protocol carries this node's self-owned state to every peer.", "observation": "A state witness protocol lets a receiver tell from a sender's message whether the sender already holds the receiver's current state.", "id": "j4"}, {"receiver": "code.manager.gateway.mesh", "provider": "code.manager.route", "purpose": "Install one IPv4 default route per working uplink, local and peer, so the kernel's lowest metric is always the best working path, and move a route when its class changes without breaking forwarding.", "function": "route_manager.c takes ALIGN_ROUTE, DELETE_ROUTE and EJECT_ROUTE from the event bus and calls core_align_route, core_delete_route and core_eject_route, which run mgm_route verbs over route_lib against table 254. Local uplinks start at 100, 150 or 400 and degrade to 800. Peer direct gateways land at 125, 225 or 325 by throughput rank. Forwarders get 650 only with experimental_indirect_uplink_routes set. Each new route takes the back of its 25-wide class, created before anything is removed.", "relation": "The route manager places every gateway's default route in its metric class.", "observation": "A route manager adds and removes kernel routes to match a routing policy.", "id": "j5"}, {"receiver": "code.manager.gateway.mesh", "provider": "code.tester.uplink", "purpose": "Know, per local non-mesh uplink, whether it reaches the internet now, so mgmd can advertise online and direct and demote a failing uplink's default route to class 800 without deleting it.", "function": "The embedded Sentry probes each eligible uplink with correlated DNS queries to its 25 fastest proven resolvers, declares UP on any reply by T2 = T0 + 2 RTO, confirms DOWN at T3 = T0 + 3 RTO, and calls mgm_apply_sentry_state directly on each Online or Offline transition. mgmd then emits PROCESS_LOCAL_ROUTE with status Up for ONLINE or TESTING and Degraded otherwise, and recomputes online and direct. Startup hydrates the same states from ubus sentry status.", "relation": "Sentry reports each local uplink's internet reachability to mgmd.", "observation": "An uplink tester decides from probe replies whether a link reaches a remote network.", "id": "j6"}, {"receiver": "code.manager.gateway.mesh", "provider": "code.failsafe.gateway.mesh", "purpose": "Catch a peer gateway that lost its uplink when this node missed that gateway's own broadcast, and drop onto the next gateway at once.", "function": "SafeNet sends a raw ICMP echo bound to br-mesh, or the bat device when there is no bridge, on average every 5 s with jitter, alternating 8.8.8.8 and 1.1.1.1 with a 1 s timeout, while the lowest-metric default route on that interface has a mesh-subnet gateway. When 3 of the last 5 fail and the newest failed, it purges that gateway's remote record, ejects its default route, sends a bumped broadcast and re-arms the convergence loop.", "relation": "The mesh safety net ejects a dead peer gateway this node was using.", "observation": "A gateway failsafe removes a gateway from use when checks through it keep failing.", "id": "j7"}, {"receiver": "code.manager.gateway.mesh", "provider": "code.identity.node", "purpose": "Classify each default route's gateway as a peer or a local uplink by the live mesh subnet, and let operators and peers reach every node by hostname and by mnemonic.", "function": "gateway_in_mesh_subnet tests a gateway against the mesh subnet taken from netifd's mesh_l3 address and mask, else mgm.core.mesh_subnet, else the bridge address. Local default-route enumeration skips gateways inside it, and direct requires a gateway outside it. /tmp/hosts/mgm maps every mesh_ip to its hostname and its mnemonic for dnsmasq.", "relation": "Node identity tells mgmd which gateways are peers and what every node is called.", "observation": "A node identity names one node distinctly among its peers.", "id": "j8"}, {"receiver": "code.manager.gateway.mesh", "provider": "code.manager.firewall", "purpose": "Let traffic from br-mesh leave through each direct uplink with masquerade and come back, and admit MGM multicast on the mesh interface, with no no-NAT gap across an mgmd restart.", "function": "mgm_firewall.c renders /var/run/mgm.nft, which fw4 includes through firewall.mgm at ruleset-append: per direct uplink a forward accept mesh-to-X, an established and related return-from-X, and masquerade NAT-to-X, plus an input accept for UDP port 9876 on the mesh input device. It re-enforces on network.interface changes and on external fw4 reloads, and clears the file on stop unless /var/run/mgm.firewall-preserve-restart marks a restart.", "relation": "The firewall manager opens forwarding and NAT from the mesh to each direct uplink.", "observation": "A firewall manager sets which packets a host forwards, translates or drops.", "id": "j9"}, {"receiver": "code.manager.gateway.mesh", "provider": "code.system.operating", "purpose": "Run under procd on OpenWrt, take mgmd's settings from UCI, hear netifd's interface events and serve MGM's ubus objects, all from one uloop.", "function": "init.d/mgmd starts /usr/sbin/mgmd under procd at START=99 with respawn 10 5 5 and adds /tmp/hosts/mgm to dnsmasq addnhosts. mgmd reads mgm.core and network sections through libuci, subscribes to network.interface, asks netifd for the mesh_l3 interface status, and registers mgm, mgm.route, mgm.batadv and sentry on ubus.", "relation": "OpenWrt hosts mgmd's process, configuration and bus.", "observation": "An operating system schedules processes and mediates their access to hardware and to each other.", "id": "j10"}, {"receiver": "code.protocol.witness.state", "provider": "code.protocol.routing.mesh", "purpose": "Carry status packets to every MGM peer on the layer-2 mesh, and tell which peers are still in range and which have returned.", "function": "batman-adv's bat0, bridged into br-mesh, floods the ff02::114 link-local group to every mesh node. Its BATADV_CMD_GET_ORIGINATORS dump, polled every 200 ms in bootstrap and every rerank_cadence_ms, default 500 ms, when live, gives each best originator's last_seen_msecs to the originator monitor, and the first non-empty dump releases startup sync.", "relation": "batman-adv floods MGM multicast across the mesh and reports originator freshness.", "observation": "A mesh routing protocol forwards traffic between nodes that are not directly linked.", "id": "j11"}, {"receiver": "code.protocol.witness.state", "provider": "code.manager.route", "purpose": "Advertise the node's current primary uplink name and gateway, and advance the state token when the egress interface changes.", "function": "After every ALIGN, DELETE or EJECT of a default route and every rtnetlink default-route add or delete, mgmd reads the kernel's lowest-metric main-table default route. An egress interface change updates primary_routes and bumps, a gateway-only change is stored passively, and a class change is ignored. Only entry 0 of primary_routes goes on the wire.", "relation": "The route manager supplies the primary uplink the protocol advertises.", "observation": "A route manager can read back which installed route the kernel prefers.", "id": "j12"}, {"receiver": "code.protocol.witness.state", "provider": "code.identity.node", "purpose": "Put the sender's orig_address, hostname, mnemonic, mesh_ip and ipgen flag in every status packet, and keep the node inactive until a mesh IPv4 exists.", "function": "orig_address is batman-adv's primary hard interface MAC. hostname is read once from gethostname. mnemonic comes from mgm_generate_mnemonic over the mnemonic MAC, seed crius and the mesh_subnet prefix. mesh_ip is netifd's mesh_l3 IPv4. Hostname and mnemonic travel as separate keys, and neither change advances the token.", "relation": "Node identity fills the identity fields of each status packet.", "observation": "A node identity lets other nodes tell one node's messages from another's.", "id": "j13"}, {"receiver": "code.manager.route", "provider": "code.protocol.witness.state", "purpose": "Learn each peer's active, online, direct, mesh_ip and advertised uplink_type so a peer gateway's route is added, re-classed or ejected as that peer's own state changes.", "function": "After recording the sender, the receive path calls core_process_inbound_state. active=false ejects the route and drops the record. online=false ejects and keeps it. direct=false ejects unless experimental_indirect_uplink_routes is set. Otherwise it emits PROCESS_REMOTE_ROUTE with gateway set to the peer mesh_ip, destination to its primary_routes dest_cidr or 0.0.0.0/0, and its uplink_type and throughput rank.", "relation": "The state witness protocol feeds each peer's advertised state to route placement.", "observation": "A state witness protocol carries each sender's own state and never a third party's.", "id": "j14"}, {"receiver": "code.manager.route", "provider": "code.protocol.routing.mesh", "purpose": "Rank direct peer gateways fastest to slowest so the fastest group takes class 125.", "function": "update_throughput_ranker_from_batman dumps BATADV_CMD_GET_ORIGINATORS on mesh_ifname through a raw generic-netlink socket with a 500 ms receive timeout, keeps rows flagged BATADV_ATTR_FLAG_BEST, and takes BATADV_ATTR_THROUGHPUT, or TQ on BATMAN IV, for peers whose record is online and direct.", "relation": "batman-adv measures the link throughput the ranker sorts by.", "observation": "A mesh routing protocol keeps a per-destination measure of path quality.", "id": "j15"}, {"receiver": "code.manager.route", "provider": "code.system.operating", "purpose": "Hold MGM's default routes in the kernel main table, where the lowest metric carries traffic.", "function": "route_lib keeps one libnl NETLINK_ROUTE socket and writes IPv4 RTPROT_STATIC unicast routes into table 254 with NLM_F_CREATE and NLM_F_REPLACE, retrying with RTNH_F_ONLINK when a peer gateway sits on another subnet. Class order is metric order, so the kernel table itself is the route queue.", "relation": "The Linux kernel forwards by the route manager's metrics.", "observation": "An operating system kernel keeps the routing table that decides where each packet goes.", "id": "j16"}, {"receiver": "code.tester.uplink", "provider": "code.resolver.recursive", "purpose": "Get an answer from the internet through each uplink so that one reply proves the uplink works.", "function": "Sentry sends google.com A queries to port 53 of resolvers taken from /etc/sentry/resolvers.json, else a builtin 250-entry list. Any DNS response with the matching id and source IP counts, whatever its rcode.", "relation": "Public resolvers answer Sentry's probes through each uplink.", "observation": "A recursive resolver answers DNS queries for any name on behalf of its clients.", "id": "j17"}, {"receiver": "code.tester.uplink", "provider": "code.system.operating", "purpose": "See every interface's carrier, IPv4 address and default route as they change, and send each probe out a chosen interface.", "function": "Sentry's own NETLINK_ROUTE socket listens on RTMGRP_LINK, IPV4_ROUTE and IPV4_IFADDR with a 1 MiB buffer and is seeded from if_nameindex, ioctl, sysfs carrier and /proc/net/route. Its epoll fd sits in mgmd's uloop. IP_PKTINFO pins each probe's egress interface. It reaps dnsbench through a signalfd for SIGCHLD.", "relation": "The kernel reports link state to Sentry and carries its probes.", "observation": "An operating system kernel reports network interface state to user processes.", "id": "j18"}, {"receiver": "code.failsafe.gateway.mesh", "provider": "code.manager.route", "purpose": "Test only the peer gateway this node actually routes through, and drop onto the next one when it fails.", "function": "The gateway under test is the lowest-metric default route on the bind interface whose gateway lies in the mesh subnet, and a change of that gateway empties the window. On a trip eject_lost_mesh_gateway emits EJECT_ROUTE for 0.0.0.0/0, which deletes that route and repacks its class, so the next gateway already holds the lowest metric.", "relation": "The route manager names and removes the gateway under test.", "observation": "A route manager can take a gateway out of the routing table.", "id": "j19"}, {"receiver": "code.failsafe.gateway.mesh", "provider": "code.protocol.witness.state", "purpose": "Make a demoted gateway answer only if it is still in the mesh, so its route returns only if its uplink works.", "function": "The trip deletes the gateway's record from the remote state cache, so the next ledger lacks its witness, and sends the bumped broadcast 'safetynet: 3 of 5 probes failed via X'. Only that gateway replies, with active=false if its uplink is dead, and its route re-aligns at the back of its class if the uplink works. The convergence loop re-arms when no remotes remain.", "relation": "The state witness protocol re-admits a purged gateway through its own reply.", "observation": "A state witness protocol makes a peer reply when the sender's message lacks that peer's witness.", "id": "j20"}, {"receiver": "code.failsafe.gateway.mesh", "provider": "code.resolver.recursive", "purpose": "Have fixed internet targets that answer ICMP echo through whichever gateway is under test.", "function": "mgm.core.probe_targets ships 8.8.8.8 then 1.1.1.1, alternated per probe, IPv4 only, and the loader substitutes the same pair when the list holds no valid entry.", "relation": "Public resolvers answer SafeNet's echoes through the peer gateway.", "observation": "A public recursive resolver is reachable at a stable address from any internet-connected host.", "id": "j21"}, {"receiver": "code.identity.node", "provider": "code.generator.address.mesh", "purpose": "Get a mesh IPv4 that is the same on every boot of this node and unique on the mesh, from whichever provider the image composes.", "function": "select_local_mesh_ipv4 first takes netifd's address for mesh_l3_ifname. With proto ipgen that address is FNV-1a over the node's persisted MAC seeded by crius, mapped into the usable window of mesh_subnet, 10.128.8.0 to 10.128.247.255 for /16, and checked by ARP duplicate detection. ipgen is not a package dependency of mgmd, and a static mesh_l3 address serves the same way.", "relation": "ipgen assigns the deterministic mesh IPv4 that node identity uses.", "observation": "A mesh address generator gives each node an address in the mesh subnet without a central server.", "id": "j22"}, {"receiver": "code.identity.node", "provider": "code.protocol.routing.mesh", "purpose": "Key this node's record on every peer by one stable MAC.", "function": "core_adapter reads the primary hard interface MAC from BATADV_CMD_GET_MESH, else the first nonzero BATADV_CMD_GET_HARDIF row preferring an active one, and sets orig_address at multicast init and on every rebind.", "relation": "batman-adv supplies the originator MAC that keys node records.", "observation": "A mesh routing protocol identifies each node by an originator address.", "id": "j23"}, {"receiver": "code.identity.node", "provider": "code.system.operating", "purpose": "Make every node's hostname and mnemonic resolvable on this node, and take the mesh_l3 address from netifd.", "function": "dnsmasq reads /tmp/hosts/mgm through the addnhosts entry that init.d/mgmd and the package postinst add. mgmd sends SIGHUP to dnsmasq by pidfile or /proc scan after each atomic rename. netifd answers network.interface.mesh_l3 status with the address and mask.", "relation": "dnsmasq resolves the names node identity writes.", "observation": "An operating system provides name resolution to local programs.", "id": "j24"}, {"receiver": "code.generator.address.mesh", "provider": "code.system.operating", "purpose": "Hand the derived address to netifd so netifd owns mesh_l3 and keeps the address across reconfiguration.", "function": "The proto handler waits up to 3 s for /sys/class/net for the device, then uses netifd's shell API: proto_init_update on the device, proto_set_keep 1, proto_add_ipv4_address and proto_send_update. It reads seed and mesh_subnet fallbacks from mgm.core through uci.", "relation": "netifd installs the address ipgen derives.", "observation": "An operating system applies interface addresses on behalf of configuration tools.", "id": "j25"}, {"receiver": "code.manager.firewall", "provider": "code.system.operating", "purpose": "Learn which interfaces are up with default routes, and have fw4 load MGM's rules into the live nft ruleset.", "function": "A synchronous ubus network.interface dump with a 500 ms timeout lists up interfaces. A device named bat or br-mesh, or containing mesh, is the mesh, and any other interface with a default route whose gateway is outside 10.128.0.0/16 is a direct uplink. The firewall.mgm include, type nftables at ruleset-append, is committed to /etc/config/firewall, and /sbin/fw4 reload is forked and awaited.", "relation": "fw4 loads MGM's forwarding and NAT rules into nftables.", "observation": "An operating system firewall filters packets by rules loaded into the kernel.", "id": "j26"}, {"receiver": "code.interface.operator", "provider": "code.system.operating", "purpose": "Reach mgmd from a shell, from rpcd and from GPIO pins.", "function": "The CLIs call ubus mgm, mgm.route and mgm.batadv, rpcd applies mgm.json to web callers, and led_pi.c opens the GPIO chip through libgpiod v2.", "relation": "OpenWrt carries operator commands to mgmd and drives the LED pins.", "observation": "An operating system gives programs shared access to IPC and hardware.", "id": "j27"}, {"receiver": "code.provisioner.mesh", "provider": "code.fallback.dhcp", "purpose": "Keep a Raspberry Pi 4 node reachable for management on eth0 whether or not the LAN has a DHCP server.", "function": "99-pi-demo sets network.lan to proto autoap with profile lan on br-lan. autoapd runs udhcpc, and when no lease arrives within 25 s and no DHCP server is heard it adds 172.16.16.1/24 and enables dnsmasq on that interface with start 100, limit 150 and lease 5m. A returning lease undoes both after a 5 s debounce.", "relation": "autoap keeps a management address on the Pi's LAN.", "observation": "A DHCP fallback serves addresses itself when no upstream DHCP server answers.", "id": "j28"}, {"receiver": "code.provisioner.mesh", "provider": "code.protocol.routing.mesh", "purpose": "Bring bat0 up with the batman-adv features MGM relies on.", "function": "Both profiles write bat0 as proto batadv, routing_algo BATMAN_V, multicast_mode 1, bridge_loop_avoidance 1, gw_mode off. pi-demo adds bat0_hardif on phy0-ibss0 with mtu 1500 and sets br-mesh mtu 1468.", "relation": "batman-adv runs the mesh the provisioner configures.", "observation": "A mesh routing protocol runs over one or more member links per node.", "id": "j29"}, {"receiver": "code.provisioner.mesh", "provider": "code.generator.address.mesh", "purpose": "Give mesh_l3 a deterministic address without assigning one per node by hand.", "function": "90-mgm-config sets network.mesh_l3 on br-mesh with proto from mesh_l3_proto, default ipgen. 99-pi-demo sets proto ipgen with hostname 1, which also writes the mnemonic into the kernel hostname.", "relation": "ipgen addresses the mesh_l3 interface the provisioner declares.", "observation": "A mesh address generator derives each address from something the node already has.", "id": "j30"}, {"receiver": "code.fallback.dhcp", "provider": "code.system.operating", "purpose": "Run as a netifd protocol on one L2 device and own that interface's DHCP service.", "function": "autoap.sh starts autoapd through proto_run_command after sending an address-less proto update. autoapd forks /sbin/udhcpc with a hook that runs dhcp.script and calls ubus autoap.IFACE event, adds and removes the fallback address with RTM_NEWADDR and RTM_DELADDR, and edits /etc/config/dhcp through libuci.", "relation": "netifd, udhcpc and dnsmasq carry out autoap's decisions.", "observation": "An operating system runs network protocol helpers on behalf of its interface manager.", "id": "j31"}], "subtypes": [], "practices": [{"target": "join", "address": "stakeholder.operator.mesh", "provider": "code.manager.gateway.mesh", "imperative": "must_not", "statement": "Do not add a multicast send unless it carries a change to a field peers route on: active, online, direct or the primary uplink. The convergence loop is the one sanctioned repetition. A converged, unchanged mesh sends nothing."}, {"target": "join", "address": "code.bus.event", "provider": null, "imperative": "must", "statement": "Before emitting EJECT_ROUTE or DELETE_ROUTE for a lost peer gateway, remove that peer's remote record and any cached primary that names it."}, {"target": "join", "address": "code.bus.event", "provider": null, "imperative": "must", "statement": "Change routes by emitting ALIGN_ROUTE, DELETE_ROUTE or EJECT_ROUTE on the event bus. Do not call route_lib or mgm_route from a state handler."}, {"target": "join", "address": "code.monitor.interface", "provider": null, "imperative": "must_not", "statement": "A link or carrier event must not set a Sentry-tracked uplink that Sentry holds offline back to status Up, class 100, primary, or online and direct true. Re-emit it as Degraded and return."}, {"target": "join", "address": "code.aggregator.connectivity", "provider": null, "imperative": "must", "statement": "Derive online as Sentry-online OR SafeNet-online, and direct from Sentry alone. A relay that reaches the internet only through a peer advertises online=true, direct=false."}, {"target": "join", "address": "code.aggregator.connectivity", "provider": null, "imperative": "must_not", "statement": "Do not set direct=true because a non-mesh default route exists in the kernel. direct needs an ONLINE or TESTING Sentry uplink with a non-degraded route."}, {"target": "join", "address": "code.api.control", "provider": null, "imperative": "must_not", "statement": "The hostname field of ubus call mgm status must never hold the mnemonic. Report the system hostname and the mnemonic as two fields."}, {"target": "join", "address": "document.reference.protocol", "provider": null, "imperative": "must", "statement": "A change to when MGM broadcasts, trips SafeNet or sets online updates docs/PROTOCOL.md and the Critical Constraints in CLAUDE.md in the same commit."}, {"target": "join", "address": "document.reference.protocol", "provider": null, "imperative": "should", "statement": "Describe the returning-remote trigger in PROTOCOL.md \"Loss and return\", with the designer's rule that a never-remote originator is not a trigger."}, {"target": "join", "address": "document.reference.connectivity", "provider": null, "imperative": "must", "statement": "Treat the RTO peak-envelope section of SENTRY.md as the spec for rto.c. Change SENTRY_RTO_SRTT_HOLD_TICKS 96, SENTRY_RTO_RTTVAR_HOLD_TICKS 32, the 64-sample window and k=4 only together with that section."}, {"target": "join", "address": "code.bootstrap.mesh", "provider": null, "imperative": "must", "statement": "Take the batman, bridge and mesh_l3 names from the mgm-config.mesh options and write the same names into mgm.core. Do not add a literal bat0, br-mesh or mesh_l3 to mgmd."}, {"target": "join", "address": "code.provisioner.mesh", "provider": "code.generator.address.mesh", "imperative": "must_not", "statement": "Do not ship a profile that sets network.mesh_l3.hostname=1 on a node running mgmd, unless mgmd stops reading the kernel hostname as its own hostname."}, {"target": "join", "address": "code.controller.server.dhcp", "provider": null, "imperative": "must", "statement": "autoapd may edit only a dhcp section that carries autoap_managed='1', and must refuse an unmarked one for its interface."}, {"target": "join", "address": "code.transport.multicast", "provider": null, "imperative": "must_not", "statement": "Do not add an IPv4 or non-ff02::/16 discovery path. Keep the socket bound to the discovered mesh bridge, re-resolve its ifindex on every send, and rebind on network.interface events."}, {"target": "join", "address": "code.codec.packet.status", "provider": null, "imperative": "must_not", "statement": "Do not serialize a receiver-local observation, such as signal, throughput, rank or metric, into the node map. Extend the boundary test when a new local field is added to status."}, {"target": "join", "address": "code.codec.packet.status", "provider": null, "imperative": "must", "statement": "Send hostname and mnemonic as two separate keys in every status packet, and parse them into two fields."}, {"target": "join", "address": "code.token.state", "provider": null, "imperative": "must", "statement": "Advance alert_mono_ns only when active, online, direct, the primary uplink interface or a roaming field changes, or on a forced send. Never advance it for mesh_ip, gateway, metric, rank, hostname or mnemonic, or between two inactive states."}, {"target": "join", "address": "code.token.state", "provider": null, "imperative": "must_not", "statement": "Do not compare two tokens by magnitude or infer freshness from them. A received token answers only \"same version or different\"."}, {"target": "join", "address": "code.ledger.witness", "provider": null, "imperative": "must", "statement": "Record the sender's state in the remote store before building any reply ledger."}, {"target": "join", "address": "code.ledger.witness", "provider": null, "imperative": "must_not", "statement": "A receiver checks only its own expected witness in other_nodes. Do not reconcile or react to acknowledgements of any third node."}, {"target": "join", "address": "code.loop.convergence", "provider": null, "imperative": "must_not", "statement": "Do not reintroduce a timed startup window or a no-gateway retry burst. The 2 s loop in convergence_loop.c is the only startup and no-remotes repetition."}, {"target": "join", "address": "code.loop.convergence", "provider": null, "imperative": "must", "statement": "Reply squelch blocks only ledger replies. State-change and forced sends go out while it is on, and a zero remote count on any tick returns the loop to phase one."}, {"target": "join", "address": "code.gate.lifecycle", "provider": null, "imperative": "must", "statement": "Make every startup prerequisite also a trigger that re-runs startup sync when it becomes true. A prerequisite that only blocks is a bug."}, {"target": "join", "address": "code.gate.lifecycle", "provider": null, "imperative": "must_not", "statement": "Do not set active=true or send the startup announcement until orig_address and a mesh IPv4 exist and the receive socket is armed."}, {"target": "join", "address": "code.authenticator.message", "provider": null, "imperative": "must_not", "statement": "Do not describe or rely on status packets as authenticated. glue_load_config forces every security_mode to debug, so no signature is sent or checked."}, {"target": "join", "address": "code.manager.gateway.mesh", "provider": "code.manager.route", "imperative": "must_not", "statement": "A route move, class change or throughput rerank must not advance the token or send multicast by itself."}, {"target": "join", "address": "code.manager.metric", "provider": null, "imperative": "must", "statement": "Keep a local uplink that Sentry marks Degraded installed at class 800. Do not delete it."}, {"target": "join", "address": "code.ranker.throughput", "provider": null, "imperative": "must_not", "statement": "A rank change emits PROCESS_REMOTE_ROUTE only. Never emit BROADCAST or bump from the ranker."}, {"target": "join", "address": "code.aligner.route", "provider": null, "imperative": "must", "statement": "Place every default route through align_route: back of its 25-wide class, create before remove, no timestamp in ordering. The metric is the route's queue position."}, {"target": "join", "address": "code.aligner.route", "provider": null, "imperative": "prefer", "statement": "On peer loss, prefer eject_route, which repacks, over delete_route, which leaves a hole."}, {"target": "join", "address": "code.manager.gateway.mesh", "provider": "code.tester.uplink", "imperative": "must_not", "statement": "Do not let Sentry test a batman device, a bridge bound to one, or any path through a peer. Mesh reachability belongs to SafeNet."}, {"target": "join", "address": "code.manager.gateway.mesh", "provider": "code.tester.uplink", "imperative": "must_not", "statement": "During Sentry status hydration, parse the whole ubus reply into MGM-owned records before applying any route or connectivity change."}, {"target": "join", "address": "code.selector.uplink", "provider": null, "imperative": "must_not", "statement": "Do not report an eligible interface Offline because the monitored-set limit displaced it. Offline comes from probe evidence, carrier loss or default-route removal."}, {"target": "join", "address": "code.pool.resolver", "provider": null, "imperative": "must", "statement": "Start from resolvers.json when it is valid and from the builtin list when it is not. Never make startup wait for a resolver refresh."}, {"target": "join", "address": "code.benchmark.resolver", "provider": null, "imperative": "must_not", "statement": "Sentry must not start dnsbench on its own or hold recovery for it. dnsbench runs only on ubus call sentry dnsbench or by hand."}, {"target": "join", "address": "code.machine.state.connectivity", "provider": null, "imperative": "must", "statement": "Keep the interval deadlines as specified: UP through T2 = T0 + 2 RTO inclusive, offline prediction only after T2, confirm DOWN at T3 = T0 + 3 RTO, and never send round 2 at or after T2."}, {"target": "join", "address": "code.estimator.timeout", "provider": null, "imperative": "must", "statement": "Keep the RTT sample, both EWMAs, the histories and the envelopes in unrounded microseconds. Round only the final RTO, up, once, with the 10 ms floor. Displayed ms values never feed back into the math."}, {"target": "join", "address": "code.estimator.timeout", "provider": null, "imperative": "must", "statement": "Feed the estimator only the first accepted reply of each interval, measured from that probe's send time."}, {"target": "join", "address": "code.publisher.telemetry", "provider": null, "imperative": "must_not", "statement": "Do not rename or drop the sentry ubus methods or the sentry.perf chart fields, and do not use Sentry telemetry as mesh gateway or path truth. Sentry does not write IVSHM."}, {"target": "join", "address": "code.manager.gateway.mesh", "provider": "code.failsafe.gateway.mesh", "imperative": "must_not", "statement": "A SafeNet trip must not broadcast. It deletes the gateway's remote record, ejects its route and empties the window. If the ejection changes the primary uplink interface, the ordinary state-change rule sends that change."}, {"target": "join", "address": "code.manager.gateway.mesh", "provider": "code.failsafe.gateway.mesh", "imperative": "must_not", "statement": "Do not add a periodic transmitter other than SafeNet's ICMP probe."}, {"target": "join", "address": "code.probe.echo", "provider": null, "imperative": "must", "statement": "Bind the echo socket to the mesh bridge, or to the batman device when there is no bridge, and take no sample when no mesh-subnet default route exists."}, {"target": "join", "address": "code.window.probe", "provider": null, "imperative": "must", "statement": "Trip only when at least 3 of the last 5 failed and the newest failed. Empty the window on a trip and on a change of gateway under test."}, {"target": "join", "address": "code.window.probe", "provider": null, "imperative": "must", "statement": "Report SafeNet offline only when no mesh gateway route is left. On a trip that leaves another gateway, or on a gateway change, carry the online verdict to the next gateway."}, {"target": "join", "address": "code.manager.gateway.mesh", "provider": "code.identity.node", "imperative": "must_not", "statement": "Classify a gateway as a peer or a local uplink only by the live mesh subnet, from netifd's mesh_l3 address and mask, then mgm.core.mesh_subnet, then the bridge address. Never by 10.128.0.0/16 or an interface name."}, {"target": "join", "address": "code.selector.address.mesh", "provider": null, "imperative": "must", "statement": "Take mesh_ip from netifd's mesh_l3 interface first. Never let the shared br-lan uplink address or the roaming /32 become mesh_ip."}, {"target": "join", "address": "code.writer.hosts", "provider": null, "imperative": "must", "statement": "Write an ip-hostname line and an ip-mnemonic line for this node and every remote."}, {"target": "join", "address": "code.manager.gateway.mesh", "provider": "code.manager.firewall", "imperative": "must", "statement": "Keep MGM's forward and masquerade rules live across a restart. Remove them only on an explicit stop."}, {"target": "join", "address": "code.verifier.ruleset", "provider": null, "imperative": "must_not", "statement": "Add no new fork or exec here, and do not copy the existing reload fork or its retry timer into new code."}, {"target": "join", "address": "code.manager.gateway.mesh", "provider": "code.system.operating", "imperative": "must", "statement": "Service every socket and timer from mgmd's single uloop, including Sentry's epoll fd. Add no threads and no second event loop."}, {"target": "join", "address": "code.bus.message", "provider": null, "imperative": "must", "statement": "Hand embedded Sentry verdicts to mgmd through the direct callback. Do not rely on mgmd receiving its own sentry.link event."}, {"target": "join", "address": "code.store.configuration", "provider": null, "imperative": "must", "statement": "Read logical interface names such as mgm.core.mesh_l3_ifname from UCI and resolve their devices through netifd. Do not bake in a section or device name."}, {"target": "join", "address": "code.protocol.witness.state", "provider": "code.protocol.routing.mesh", "imperative": "must_not", "statement": "Keep loss detection from batman last_seen local. Never advertise another node's loss or state."}, {"target": "join", "address": "code.tracker.route.primary", "provider": null, "imperative": "must", "statement": "Bump only when the kernel's lowest-metric default route moves to a different egress interface. Store a gateway-only change passively and ignore a class change."}, {"target": "join", "address": "code.tracker.route.primary", "provider": null, "imperative": "should", "statement": "Pass the real cause, such as a SafeNet eject or a Sentry verdict, into core_refresh_primary_route_if_changed so the Primary uplink change reason names it."}, {"target": "join", "address": "code.protocol.witness.state", "provider": "code.identity.node", "imperative": "must_not", "statement": "Do not let hostname, mnemonic or mesh_ip changes advance the token, and never write one name into the other's field."}, {"target": "join", "address": "code.locator.interface.mesh", "provider": null, "imperative": "must", "statement": "Re-read batman's primary hard-interface address on every link event, without filtering by IFLA_MASTER, and treat a change as a new orig_address."}, {"target": "join", "address": "code.generator.mnemonic", "provider": null, "imperative": "must", "statement": "Change the mnemonic derivation in mgm_mnemonic.c and ipgen.c together: MAC source, seed, prefix window, rotation and word list."}, {"target": "join", "address": "code.manager.route", "provider": "code.protocol.witness.state", "imperative": "must", "statement": "Add, re-class or eject a peer's route only from that peer's own advertised active, online and direct flags."}, {"target": "join", "address": "code.cache.state.remote", "provider": null, "imperative": "must", "statement": "Count tombstones toward the remote map's rehash threshold, and drop them on rehash. Any change to map_put, map_remove or map_find keeps map_find from running out of empty slots."}, {"target": "join", "address": "code.monitor.originator", "provider": null, "imperative": "must_not", "statement": "Do not remove the returning-remote trigger or replace it with a remote-count exhaustion detector. A former remote that timed out and returns must cause one bumped broadcast from this node."}, {"target": "join", "address": "code.monitor.originator", "provider": null, "imperative": "must", "statement": "Arm the trigger only for originators that were remotes. A batman originator that never became a remote is not a trigger."}, {"target": "join", "address": "code.monitor.originator", "provider": null, "imperative": "must", "statement": "When an unknown originator appears, broadcast only if this node is offline. If this node has internet, leave the broadcast to the other node."}, {"target": "join", "address": "code.monitor.originator", "provider": null, "imperative": "should", "statement": "Send one broadcast per return: at most one trigger winner per poll, and clear the trigger once its broadcast is sent or the record returns."}, {"target": "join", "address": "code.manager.route", "provider": "code.protocol.routing.mesh", "imperative": "must_not", "statement": "Treat batman next-hop and throughput changes as local only. They may re-class routes but must not send multicast."}, {"target": "join", "address": "code.table.routing", "provider": null, "imperative": "must_not", "statement": "Write routes to table 254 only through route_lib's netlink socket. Never shell out to ip route."}, {"target": "join", "address": "code.tester.uplink", "provider": "code.system.operating", "imperative": "must_not", "statement": "Add no blocking wait to Sentry, and do not copy the startup wait loop into new code."}, {"target": "join", "address": "code.failsafe.gateway.mesh", "provider": "code.manager.route", "imperative": "must", "statement": "Test only the lowest-metric default route on the SafeNet bind interface with a mesh-subnet gateway, and remove a tripped gateway with EJECT_ROUTE, not DELETE_ROUTE."}, {"target": "join", "address": "code.failsafe.gateway.mesh", "provider": "code.protocol.witness.state", "imperative": "must", "statement": "On a trip, delete the gateway's remote record before ejecting its route, so this node's next ledger lacks its witness and only that gateway replies."}, {"target": "join", "address": "code.identity.node", "provider": "code.generator.address.mesh", "imperative": "must_not", "statement": "Do not make ipgen or 10.128.0.0/16 a requirement of mgmd. A static mesh_l3 address from netifd must work the same way."}, {"target": "join", "address": "code.initializer.address", "provider": null, "imperative": "must_not", "statement": "Do not replace the first-install static handoff in 50-ipgen-proto with a netifd or full network restart."}, {"target": "join", "address": "code.identity.node", "provider": "code.protocol.routing.mesh", "imperative": "must", "statement": "When orig_address changes, update the store, refresh the identity, force one broadcast, and make roaming release under the old identity and reinitialize under the new one."}, {"target": "join", "address": "code.forwarder.dns", "provider": null, "imperative": "must", "statement": "After replacing /tmp/hosts/mgm, send SIGHUP only to dnsmasq processes whose command line or config references that file. Never restart dnsmasq."}, {"target": "join", "address": "code.manager.firewall", "provider": "code.system.operating", "imperative": "must_not", "statement": "Classify the mesh device by the discovered batman master and a peer gateway by the discovered mesh subnet. Do not add another prefix or interface-name test to the firewall."}, {"target": "join", "address": "stakeholder.operator.mesh", "provider": null, "imperative": "must_not", "statement": "Do not add a setting the operator must enter on each node before it joins the mesh. A new option ships a working default or is discovered from batman-adv, netifd or the kernel, so a node flashed with the shipped UCI goes active and installs routes."}, {"target": "join", "address": "stakeholder.operator.mesh", "provider": "code.interface.operator", "imperative": "must", "statement": "Every operator view of a node shows its hostname and its mnemonic as two fields, and takes the hostname from mgm status or mgm list, never from the live kernel hostname."}, {"target": "join", "address": "stakeholder.operator.mesh", "provider": "document.guide.operator", "imperative": "must", "statement": "A commit that adds an mgm UCI read, removes one, or changes what an option does updates the option table in docs/OPERATIONS.md in the same commit, and marks the option live or inert."}, {"target": "join", "address": "code.interface.operator", "provider": null, "imperative": "must", "statement": "Every ubus method an operator surface names, in the CLIs, the rpcd ACL or OPERATIONS.md, is one that mgmd registers in mgm_methods, mgm_route_methods or batadv_methods. Removing a method removes it from every surface in the same commit."}, {"target": "join", "address": "code.interface.operator", "provider": "code.system.operating", "imperative": "must", "statement": "Write acl.d/mgm.json in the shape rpcd reads: each top-level key is an access group whose children are read and write. Grant only methods mgmd registers."}, {"target": "join", "address": "code.cli.operator", "provider": null, "imperative": "must", "statement": "The CLIs read mgmd output by the keys mgmd emits today: local_state, remotes, primary_routes.entries in status, and hostname, mnemonic, ip and metric in list. A commit that renames one of these keys changes every CLI that reads it."}, {"target": "join", "address": "code.cli.operator", "provider": null, "imperative": "must_not", "statement": "Do not name the batman device in a CLI or login script. Take it from mgm status mesh_ifname, which mgmd discovers."}, {"target": "join", "address": "code.indicator.led", "provider": null, "imperative": "must_not", "statement": "Do not choose LED modes by re-reading state on a timer. Set the mode when local state, the remote store or the primary route changes, and keep a timer only for the next blink step."}, {"target": "join", "address": "code.indicator.led", "provider": null, "imperative": "should", "statement": "Show the WAN LED as via-mesh when the primary route's gateway lies in the live mesh subnet, not when the primary uplink's name equals mesh_bridge."}, {"target": "join", "address": "code.observer.readiness", "provider": null, "imperative": "must", "statement": "Keep mgm-ready-observe's predicate keyed to status lifecycle equal to live, init_ready and local_state.active, and to mgm.batadv originators data[].last_seen_msecs. A commit that renames one of these in mgmd changes the observer with it."}, {"target": "join", "address": "code.observer.readiness", "provider": null, "imperative": "must", "statement": "Register the mgm.packet, mgm.observe, network.interface and sentry.link handlers before taking the first status snapshot."}, {"target": "join", "address": "document.guide.operator", "provider": null, "imperative": "must", "statement": "Keep README.md's package list and PACKAGES.md's declared-dependency column equal to the package directories and each package Makefile's DEPENDS. Change them in the commit that changes a Makefile."}, {"target": "join", "address": "document.index.authority", "provider": null, "imperative": "must", "statement": "List every tracked file under docs/ in docs/README.md: canonical documents in the authority table and the reading order, the six symlinks as aliases, and anything else with an authority label. Add or rename a document and its index entry in the same commit."}, {"target": "join", "address": "document.reference.routing", "provider": null, "imperative": "must", "statement": "Keep ROUTING.md's metric-class table equal to the constants in metric_manager.c and the assertions in test_metric_manager.c. A class value changes in all three in one commit."}, {"target": "join", "address": "document.reference.architecture", "provider": null, "imperative": "must", "statement": "Keep ARCHITECTURE.md's ubus table equal to mgm_methods, mgm_route_methods and batadv_methods in mgm.c, and its flow list equal to how state actually reaches mgmd."}, {"target": "join", "address": "stakeholder.operator.mesh", "provider": "code.provisioner.mesh", "imperative": "must_not", "statement": "Do not make a provisioning package write a per-node value. Every node gets the same UCI from its profile, and each node's mesh address and mnemonic come from ipgen at run time."}, {"target": "join", "address": "code.provisioner.mesh", "provider": null, "imperative": "must", "statement": "A mesh defaults script sets an option only when its value differs, appends bat0 to the bridge's ports list instead of replacing the list, and deletes itself when done."}, {"target": "join", "address": "code.profile.device", "provider": null, "imperative": "must", "statement": "A device profile that builds a mesh stack writes the names it built into mgm.core: mesh_ifname, mesh_bridge and mesh_l3_ifname."}, {"target": "join", "address": "code.profile.device", "provider": null, "imperative": "must_not", "statement": "Do not delete a bridge's ports list or other wifi-iface sections to rebuild them. Add the ports the profile needs."}, {"target": "join", "address": "code.provisioner.mesh", "provider": "code.fallback.dhcp", "imperative": "must", "statement": "A profile that sets an interface to proto autoap also marks that interface's dhcp section with autoap_managed='1' in the same defaults script, or removes the unmarked section."}, {"target": "join", "address": "code.provisioner.mesh", "provider": "code.protocol.routing.mesh", "imperative": "must", "statement": "Write bat0 with gw_mode off in every profile. MGM, not batman-adv, chooses each node's internet gateway."}, {"target": "join", "address": "code.provisioner.mesh", "provider": "code.protocol.routing.mesh", "imperative": "must", "statement": "Keep bridge_loop_avoidance 1 on bat0 in any profile that bridges non-batman ports into the mesh bridge."}, {"target": "join", "address": "code.fallback.dhcp", "provider": null, "imperative": "must", "statement": "Save the dhcp section's ignore, start, limit, leasetime and marker to /var/run/autoap-IFACE.dhcp once, before the first edit, and treat an existing file at start as already saved. Restore from it and remove the fallback address on stop."}, {"target": "join", "address": "code.machine.state.fallback", "provider": null, "imperative": "must", "statement": "Count as upstream only an IPv4 on the interface that is not the fallback address, in both the netifd status path and the getifaddrs path."}, {"target": "join", "address": "code.detector.server.dhcp", "provider": null, "imperative": "must", "statement": "Run the upstream-server sniff only in DHCP_TRY, after autoapd has set its own dhcp section to ignore=1, and keep it passive: it sends nothing."}, {"target": "join", "address": "code.fallback.dhcp", "provider": "code.system.operating", "imperative": "must", "statement": "Give the udhcpc that autoapd forks INTERFACE set to the logical UCI interface, as OpenWrt's dhcp proto does, so netifd's dhcp.script can apply the lease."}, {"target": "join", "address": "code.generator.address.mesh", "provider": null, "imperative": "must", "statement": "Choose the automatic identity MAC once, the lowest-ifindex valid non-loopback MAC from getifaddrs, write it with O_EXCL to /etc/ipgen.mac, and read that file on every later run. An explicit macsrc overrides it. Any other deriver of the mnemonic must use the same MAC."}, {"target": "join", "address": "code.detector.conflict.address", "provider": null, "imperative": "must", "statement": "Run the ARP probe on the interface that will carry the address, passed as -i, not on the MAC source interface."}, {"target": "join", "address": "code.detector.conflict.address", "provider": null, "imperative": "must", "statement": "Keep the probe's sender IP 0.0.0.0, and count a conflict only from an ARP reply whose sender IP is the candidate."}, {"target": "join", "address": "code.detector.conflict.address", "provider": null, "imperative": "must", "statement": "Treat a conflict rehash as a change of identity. ipgen builds the mnemonic from the accepted hash, so a rehashed node has a new address and a new mnemonic, and every other mnemonic deriver must start from that accepted hash."}, {"target": "join", "address": "code.handler.protocol", "provider": null, "imperative": "must", "statement": "Report the configured system hostname as the proto data hostname and the mnemonic as mnemonic. Never put the mnemonic in a field named hostname."}, {"target": "join", "address": "code.handler.protocol", "provider": null, "imperative": "must", "statement": "Pass the device name to proto_init_update and the logical interface name to proto_send_update, and set proto_set_keep 1."}, {"target": "join", "address": "code.generator.address.mesh", "provider": "code.system.operating", "imperative": "must_not", "statement": "Do not let the handler's 10.128.0.0/16 default decide a node's subnet. The subnet comes from the interface's network option, which 50-ipgen-proto fills from mgm.core.mesh_subnet."}, {"target": "join", "address": "code.identity.node", "provider": null, "imperative": "must", "statement": "Derive mesh_ip and the mesh subnet from the same source in the same order: netifd's mesh_l3 address and mask, then mgm.core.mesh_subnet, then the bridge chain. Change select_local_mesh_ipv4 and get_mesh_subnet_from_mesh together."}, {"target": "join", "address": "code.identity.node", "provider": "code.system.operating", "imperative": "must", "statement": "Register /tmp/hosts/mgm as a dnsmasq addnhosts entry from the package postinst and from init.d/mgmd start, and only after checking it is not already listed. mgmd itself only writes the file and signals dnsmasq."}, {"target": "join", "address": "code.manager.gateway.mesh", "provider": null, "imperative": "must", "statement": "Do no shutdown work inside the SIGTERM or SIGINT handler. The handler only writes one byte to the self-pipe; signal_fd_cb, running in the uloop, sets active=false for the goodbye and ends the loop 150 ms later, and firewall and multicast teardown run after uloop_run returns."}, {"target": "join", "address": "code.manager.gateway.mesh", "provider": "code.protocol.witness.state", "imperative": "must", "statement": "Put the sender's complete current state in every status packet. Do not send a delta, a partial node map or a packet that omits a field because it did not change."}, {"target": "join", "address": "code.engine.command.route", "provider": null, "imperative": "must", "statement": "Keep the verb result codes stable: rc 0 is success, rc 1 is success with duplicates removed, and anything above 1 is failure, with 5 meaning the class has no free slot. The core wrappers and the ubus mgm.route object share this one engine and read the codes the same way."}, {"target": "join", "address": "code.supervisor.process", "provider": null, "imperative": "must", "statement": "Treat a crash in mgmd's first 10 seconds as fatal to the node. procd runs mgmd with respawn 10 5 5, so 5 exits inside 10 s of start leave mgmd stopped until someone restarts it. Test every startup path, including Sentry hydration and the first batman dump, on a 16-node restart before shipping."}, {"target": "join", "address": "code.manager.interface.network
