<!doctype html>
<!-- The roundtable runner's own render page, BASE-066: loaded by its headless Chromium, never shown. `shot(state,
     position)` brings the scene to the table's state and returns the seat's view from its own eyes as a PNG data URL.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roundtable render</title>
<script type="importmap">{"imports": {"three": "/vendor/three.module.min.js", "three/addons/": "/vendor/three-addons/"}}</script>
<style>html, body { margin: 0; background: #0b0e16; }</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { createTable } from '/scene.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const table = createTable(renderer, { snap: true });

window.shot = (state, position) => {
  table.update(state);
  for (let i = 0; i < 20; i += 1) table.frame(1 / 30);  // the figures settle into their idle pose
  return table.eyeShot(position);
};
window.ready = true;
</script>
</body>
</html>
