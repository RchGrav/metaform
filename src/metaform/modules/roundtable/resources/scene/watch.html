<!doctype html>
<!-- The roundtable's watch page, BASE-066: the person's view of a table from above, served by the table's runner on
     the loopback only. It polls the runner's /state twice a second and draws it with scene.js: who faces whom, raised
     hands, and each kept answer in a bubble over its seat for a few seconds. Drag to look round, scroll to zoom. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roundtable</title>
<script type="importmap">{"imports": {"three": "/vendor/three.module.min.js", "three/addons/": "/vendor/three-addons/"}}</script>
<style>
  :root { color-scheme: dark; --ink: #e8ecf8; --dim: #9aa4c0; --panel: rgba(14, 18, 30, 0.82); }
  html, body { margin: 0; height: 100%; background: #0b0e16; color: var(--ink); font: 14px/1.4 system-ui, sans-serif;
    overflow: hidden; }
  canvas { display: block; }
  #bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 12px; align-items: baseline;
    padding: 8px 14px; background: var(--panel); border-radius: 10px; flex-wrap: wrap; }
  #title { font-weight: 600; }
  #phase { color: var(--dim); }
  #error { position: fixed; bottom: 12px; left: 12px; color: #ff9b9b; }
</style>
</head>
<body>
<div id="bar"><span id="title">Roundtable</span><span id="phase"></span></div>
<div id="error"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createTable } from '/scene.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
document.body.appendChild(renderer.domElement);
const table = createTable(renderer);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
let placed = false;

function size() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
}
window.addEventListener('resize', size); size();

const phaseWords = { explore: 'the seats are exploring their controls', running: 'in discussion', held: 'held',
  ending: 'ending: the report is being written', ended: 'ended' };
async function poll() {
  try {
    const answer = await fetch('/state', { cache: 'no-store' });
    if (!answer.ok) throw new Error(`the runner answered ${answer.status}`);
    const state = await answer.json();
    table.update(state);
    if (!placed) {  // from above and a little toward the first seat, so the figures read
      const ring = state.table.ring;
      camera.position.set(0, ring * 1.45 + 2.2, ring * 1.35 + 2); controls.update(); placed = true;
    }
    document.getElementById('title').textContent = `Roundtable ${state.discussion}: ${state.subject.replaceAll('-', ' ')}`;
    const left = state.phase === 'explore' ? ` (${state.explore_left} s)` : '';
    const speaking = state.seats.find((seat) => seat.speaking);
    document.getElementById('phase').textContent = `${phaseWords[state.phase] || state.phase}${left}` +
      (speaking && state.phase === 'running' ? `; ${speaking.name}'s turn` : '');
    document.getElementById('error').textContent = '';
  } catch (error) {
    document.getElementById('error').textContent = `Not reaching the table: ${error.message}`;
  }
}
poll(); setInterval(poll, 500);

let last = performance.now();
function draw(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  table.frame(dt); controls.update(); renderer.render(table.scene, camera);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
window.ready = true;
</script>
</body>
</html>
