<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connect a Metaform</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fafafa; --muted: #5f6368; --accent: #2457c5; --warn: #9a5b00; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --bg: #17181a; --muted: #a0a4a8; --accent: #7aa2ff; --warn: #f0b35a; } }
  body { font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; }
  main { max-width: 32rem; margin: 10vh auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  dt { color: var(--muted); margin-top: .6rem; }
  dd { margin: 0; overflow-wrap: anywhere; }
  .warn { color: var(--warn); }
  .row { display: flex; gap: .75rem; margin-top: 1.5rem; flex-wrap: wrap; }
  button { font: inherit; padding: .6rem 1.2rem; border-radius: .5rem; border: 1px solid var(--accent); background: transparent; color: var(--fg); cursor: pointer; }
  button[value=approve] { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Connect a Metaform</h1>
  <p>Signed in as <strong>{{account}}</strong>. Type the code your terminal shows after <code>metaform cloud login</code>.</p>
  {{said}}
  <form method="get" action="/device">
    <p><input name="user_code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX"
              style="font: inherit; font-size: 1.4rem; letter-spacing: .15em; padding: .4rem .6rem; width: 11rem"></p>
    <div class="row"><button type="submit" value="approve">Continue</button></div>
  </form>
</main>
</body>
</html>
