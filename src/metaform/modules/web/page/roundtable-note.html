<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Roundtable note</title>
  <link rel="stylesheet" href="/page/roundtable-note.css">
  <script defer src="/vendor/markdown-it-15.0.3.min.js"></script>
  <script type="module" src="/page/roundtable-note.js"></script>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Roundtable note</p>
      <h1 id="note-title">Loading note…</h1>
