<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metaform</title>
<link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="/vendor/codemirror/dialog.css">
<link rel="stylesheet" href="/page/app.css">
<script src="/page/theme.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span>meta<b>form</b></span></div>
    <div class="ctx">
      <label for="proj">project</label>
      <select id="proj"></select>
      <label for="mf">metaform</label>
      <select id="mf"></select>
    </div>
    <button class="clearbtn" id="exportBtn" title="Save the map as a short Markdown document">Export</button>
    <div class="clearpick">
      <button class="clearbtn" id="clearBtn" aria-expanded="false" aria-controls="clearbox" title="Remove this project's metaforms and reports; it says what goes and what stays, and asks first">Clear project</button>
      <div class="clearbox" id="clearbox" hidden role="dialog" aria-label="Clear project"></div>
    </div>
    <div class="themepick">
      <label for="theme">colors</label>
      <select id="theme">
        <option value="space">space</option>
        <option value="midnight">midnight</option>
        <option value="graphite">graphite</option>
        <option value="plum">plum</option>
        <option value="forest">forest</option>
        <option value="ember">ember</option>
        <option value="paper">paper</option>
        <option value="mist">mist</option>
      </select>
    </div>
    <div class="layerpick">
      <button class="layersbtn" id="layersBtn" aria-expanded="false" aria-controls="layerlist">Layers</button>
      <div class="layerlist" id="layerlist" hidden>
        <div id="layers" role="group" aria-label="Layers shown in this view"></div>
        <p class="note" id="note"></p>
        <button class="apply" id="apply" disabled>Apply to folder</button>
      </div>
    </div>
  </header>

  <aside>
    <div class="map2d" id="map2d" tabindex="0" aria-label="The whole map. Down goes deeper, Up back to the parent, Left and Right across; Enter goes inside, Escape out; F cycles the view.">
      <div class="bar2d">
        <div class="navbtns"><button id="backBtn" title="Back to the node selected before" disabled>&lsaquo; Back</button><button id="forwardBtn" title="Forward again" disabled>Forward &rsaquo;</button></div>
        <nav class="crumbs" id="crumbs" hidden aria-label="Where you are inside the map"></nav>
        <div class="mapbtns"><button id="fitBtn" title="Zoomed out, zoomed in, regular (F)">Fit</button></div>
      </div>
      <div class="viewport" id="viewport"></div>
      <span class="kbd">click again or Enter: in · Esc: out · arrows: walk · F: view</span>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-object" aria-selected="true">Object</button>
      <button role="tab" id="t-prov" aria-selected="false">Provenance</button>
      <button role="tab" id="t-prompt" aria-selected="false">Prompt</button>
      <button role="tab" id="t-corr" aria-selected="false">Corrections</button>
    </div>
    <section class="pane" id="p-object"></section>
    <section class="pane" id="p-prov" hidden></section>
    <section class="pane" id="p-prompt" hidden>
      <div class="toolbar">
        <select id="promptSel" aria-label="Prompt"></select>
        <select id="verSel" aria-label="Version"></select>
        <button class="btn" id="diffBtn">Show changes</button>
        <button class="btn primary" id="saveBtn">Save as new version</button>
      </div>
      <textarea id="editor"></textarea>
      <div id="diffOut" class="diff" hidden></div>
      <p class="empty" id="promptNote"></p>
    </section>
    <section class="pane" id="p-corr" hidden></section>
  </aside>

  <main>
    <div id="stage" aria-label="3D map of the metaform" tabindex="0"></div>
    <div id="labels3d" aria-hidden="true"></div>
    <div class="tip3d" id="tip3d" hidden></div>
    <button id="messages" hidden title="Go to the oldest open question"></button>
    <div class="hint">drag to orbit · scroll to zoom · click a node</div>
    <div class="stagebtns"><button id="pauseBtn" data-paused="false">Pause layout</button><button id="relayoutBtn">Re-run layout</button></div>
    <div class="legend" id="legend"></div>
    <div class="count" id="count"></div>
  </main>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<div id="draw" aria-hidden="true"></div>
<script src="/vendor/3d-force-graph.min.js"></script>
<script src="/vendor/mermaid.min.js"></script>
<script src="/vendor/codemirror/codemirror.js"></script>
<script src="/vendor/codemirror/xml.js"></script>
<script src="/vendor/codemirror/markdown.js"></script>
<script src="/vendor/codemirror/dialog.js"></script>
<script src="/vendor/codemirror/searchcursor.js"></script>
<script src="/vendor/codemirror/search.js"></script>
<script type="module" src="/page/app.js"></script>
</body>
</html>
