<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metaform</title>
<link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="/vendor/codemirror/dialog.css">
<link rel="stylesheet" href="/page/app.css">
<script src="/page/theme.js"></script>
<script type="importmap">{"imports": {"three": "/vendor/three.module.min.js"}}</script>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span>meta<b>form</b></span></div>
    <div class="ctx">
      <label for="proj">project</label>
      <select id="proj"></select>
      <label for="mf">metaform</label>
      <select id="mf"></select>
    </div>
    <button class="clearbtn" id="exportBtn" title="Save the map as a short Markdown document">Export</button>
    <div class="clearpick">
      <button class="clearbtn" id="adminBtn" aria-expanded="false" aria-controls="adminbox" title="Acts on the project as a whole">Administration</button>
      <div class="adminbox" id="adminbox" hidden role="menu">
        <button id="clearBtn" role="menuitem" title="Remove this project's metaforms and reports. It is backed up first, it says what goes and what stays, and it asks first">Clear project</button>
        <button id="restoreBtn" role="menuitem" disabled title="Bring back what a clear removed, from the backup the clear made">Restore a backup</button>
      </div>
      <div class="clearbox" id="clearbox" hidden role="dialog" aria-label="Clear project"></div>
    </div>
    <button id="messages" hidden title="Go to the oldest message that waits for you"></button>
    <div class="themepick">
      <label for="theme">colors</label>
      <select id="theme">
        <option value="space">space</option>
        <option value="midnight">midnight</option>
        <option value="graphite">graphite</option>
        <option value="plum">plum</option>
        <option value="forest">forest</option>
        <option value="ember">ember</option>
        <option value="paper">paper</option>
        <option value="mist">mist</option>
      </select>
    </div>
    <div class="layerpick">
      <button class="layersbtn" id="layersBtn" aria-expanded="false" aria-controls="layerlist">Layers</button>
      <div class="layerlist" id="layerlist" hidden>
        <div id="layers" role="group" aria-label="Layers shown in this view"></div>
        <p class="note" id="note"></p>
        <button class="apply" id="apply" disabled>Apply to folder</button>
      </div>
    </div>
  </header>

  <aside>
    <div class="small" id="small">
    <div class="map2d" id="map2d" tabindex="0" aria-label="The whole map. Down goes deeper, Up back to the parent, Left and Right across; Enter goes inside, Escape out; F cycles the view.">
      <div class="bar2d">
        <div class="navbtns"><button id="backBtn" title="Back to the node selected before" disabled>&lsaquo; Back</button><button id="forwardBtn" title="Forward again" disabled>Forward &rsaquo;</button></div>
        <nav class="crumbs" id="crumbs" hidden aria-label="Where you are inside the map"></nav>
        <div class="mapbtns"><button id="fitBtn" title="Zoomed out, zoomed in, regular (F)">Fit</button><button id="swapBtn" title="Put this map in the large area, and the 3D map here">Swap</button></div>
      </div>
      <div class="viewport" id="viewport"></div>
      <span class="kbd">click again or Enter: in · Esc: out · arrows: walk · F: view</span>
    </div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-object" aria-selected="true">Object</button>
      <button role="tab" id="t-prov" aria-selected="false">Provenance</button>
      <button role="tab" id="t-prompt" aria-selected="false">Prompt</button>
      <button role="tab" id="t-corr" aria-selected="false">Corrections</button>
    </div>
    <section class="pane" id="p-object"></section>
    <section class="pane" id="p-prov" hidden></section>
    <section class="pane" id="p-prompt" hidden>
      <div class="toolbar">
        <select id="promptSel" aria-label="Prompt"></select>
        <select id="verSel" aria-label="Version"></select>
        <button class="btn" id="diffBtn">Show changes</button>
        <button class="btn primary" id="saveBtn">Save as new version</button>
      </div>
      <textarea id="editor"></textarea>
      <div id="diffOut" class="diff" hidden></div>
      <p class="empty" id="promptNote"></p>
    </section>
    <section class="pane" id="p-corr" hidden></section>
  </aside>

  <main>
    <div id="big3d">
    <div class="bar3d">
      <div class="navbtns"><button id="pauseBtn" data-paused="false">Pause layout</button><button id="relayoutBtn">Re-run layout</button></div>
      <div class="mapbtns"><button id="fit3dBtn" title="The whole map in view, or close on the selected node">Fit</button><button id="swap3dBtn" title="Put this map in the small area, and the 2D map here">Swap</button></div>
    </div>
    <div class="view3d">
    <div id="stage" aria-label="3D map of the metaform" tabindex="0"></div>
    <div id="labels3d" aria-hidden="true"></div>
    <div class="tip3d" id="tip3d" hidden></div>
    <div class="legend" id="legend"></div>
    <div class="count" id="count"></div>
    </div>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<div id="menu" hidden role="menu" aria-label="What can be done with this node"></div>
<div id="float" hidden role="dialog" aria-label="Messages">
  <div class="bar"><span class="title"></span><button class="close" title="Close">Close</button></div>
  <div class="body"></div>
</div>
<div id="task" hidden role="dialog" aria-label="Add a task">
  <div class="bar"><span class="title"></span><button class="full" title="Fill the screen, and back">Full screen</button><button class="close" title="Close">Close</button></div>
  <div class="body">
    <div class="write">
      <label>The work is <select class="condition"><option value="missing">to build something</option><option value="broken">to fix something</option></select></label>
      <div class="text" contenteditable="true" role="textbox" aria-multiline="true" aria-label="The task"></div>
      <div class="eyebrow">Nodes of this task</div>
      <div class="linked"></div>
      <button class="put" title="Write this task on every node listed above, where agents find it and take it">Add task</button>
      <div class="chartbox"><div class="chart" aria-label="A chart of the project to look around and choose parts from"></div><button class="whole" title="The whole chart in view">Fit</button></div>
    </div>
    <div class="pick">
      <div class="browser"><input type="search" placeholder="Find a part" aria-label="Find a part"><div class="rows"></div></div>
      <div class="acts"><button class="insert" disabled title="Put its name into the text, at the cursor">Insert</button><button class="link" disabled title="Add it to the nodes of this task">Link</button></div>
    </div>
  </div>
</div>
<div id="element" hidden role="dialog" aria-label="Add an element">
  <div class="bar"><span class="title"></span><button class="close" title="Close">Close</button></div>
  <div class="body">
    <label>Address <input class="address" list="addresses" placeholder="code.alarm.visible" autocomplete="off"></label>
    <datalist id="addresses"></datalist>
    <div class="row"><label>Words of its name <input class="length" type="number" min="1" max="9" value="1" title="How many segments of the address, read from the leaf, name it"></label>
      <label>Role <select class="role"><option value="">none given</option><option>SE</option><option>NE</option><option>DE</option><option>VE</option><option>AUE</option></select></label></div>
    <label>The purpose is held by <select class="receives"><option value="node"></option><option value="new">the new element, and this node serves it</option></select></label>
    <label>Purpose <textarea class="purpose" placeholder="What the one that holds the purpose needs this for"></textarea></label>
    <label>Function <textarea class="function" placeholder="What the one that serves does"></textarea></label>
    <label class="check"><input type="checkbox" class="validate" checked> Have an agent validate it</label>
    <button class="add">Add element</button>
  </div>
</div>
<div id="notes" hidden role="dialog" aria-label="Notes">
  <div class="bar"><span class="title"></span><button class="close" title="Close">Close</button></div>
  <div class="body">
    <ul class="kept"></ul>
    <textarea placeholder="A note for whoever works here next, a person or an agent" aria-label="A new note"></textarea>
    <button class="add">Add note</button>
  </div>
</div>
<div id="draw" aria-hidden="true"></div>
<script src="/vendor/3d-force-graph.min.js"></script>
<script src="/vendor/mermaid.min.js"></script>
<script src="/vendor/codemirror/codemirror.js"></script>
<script src="/vendor/codemirror/xml.js"></script>
<script src="/vendor/codemirror/markdown.js"></script>
<script src="/vendor/codemirror/dialog.js"></script>
<script src="/vendor/codemirror/searchcursor.js"></script>
<script src="/vendor/codemirror/search.js"></script>
<script type="module" src="/page/app.js"></script>
</body>
</html>
