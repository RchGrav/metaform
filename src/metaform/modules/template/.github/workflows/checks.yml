# This module's type check, lint and tests on Linux, macOS and Windows for every change, QUAL-003.
# A module is checked inside the Metaform it plugs into: the job checks out Metaform, places this module
# among its modules, and runs Metaform's own checks on it.
name: checks

on:
  push:
  pull_request:

env:
  METAFORM_REPOSITORY: RchGrav/metaform
  METAFORM_REF: chassis

jobs:
  checks:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Metaform's declared minimum and the newest released Python, E6.
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.METAFORM_REPOSITORY }}
          ref: ${{ env.METAFORM_REF }}
          path: metaform
      - uses: actions/checkout@v4
        with:
          path: metaform/src/metaform/modules/${{ github.event.repository.name }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: metaform
        run: uv sync --extra dev
      - name: Type check, QUAL-004
        working-directory: metaform
        run: uv run pyright src/metaform/modules/${{ github.event.repository.name }}
      - name: Lint, QUAL-005
        working-directory: metaform
        run: uv run ruff check src/metaform/modules/${{ github.event.repository.name }}
      - name: Tests
        working-directory: metaform
        run: uv run pytest -q src/metaform/modules/${{ github.event.repository.name }}
