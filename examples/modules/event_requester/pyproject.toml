[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "metaform-event-requester"
version = "0.1.0"
description = "Event requester derived from the standalone chassis template"
requires-python = ">=3.11"
dependencies = ["metaform-chassis>=0.2", "click>=8.2,<9"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "event_requester"
