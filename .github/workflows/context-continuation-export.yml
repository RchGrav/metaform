name: context continuation source export
on:
  push:
    branches: [context-management-pro-handoff-879f2314]
    paths: [.github/workflows/context-continuation-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked source and verification inputs
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, zipfile
          roots = ('src/', 'tests/', 'docs/reviews/', 'specifications/', '.agents/', '.claude/agents/', '.claude/skills/metaform-development/')
          files = {'AGENTS.md', 'CLAUDE.md', 'README.md', 'conftest.py', 'pyproject.toml', 'uv.lock', 'hatch_build.py', '.gitignore'}
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          manifest = {}
          with zipfile.ZipFile('continuation-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  if name and (name in files or name.startswith(roots)) and pathlib.Path(name).is_file():
                      data = pathlib.Path(name).read_bytes()
                      archive.writestr(name, data)
                      manifest[name] = hashlib.sha256(data).hexdigest()
              archive.writestr('CONTINUATION_SOURCE_MANIFEST.json', json.dumps({'base': '879f2314f9eb7b11fa46efeffdd126cd04aef733', 'files': manifest}, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: context-continuation-source
          path: continuation-source.zip
          retention-days: 1
