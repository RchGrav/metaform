# Type check, lint and tests on Linux, macOS and Windows for every change, QUAL-003.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The declared minimum, the requires-python lower bound, and the newest released Python, E6.
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --extra dev
      - name: Browser for the web GUI's checks, VIEW-012
        run: uv run playwright install --with-deps chromium
      - name: Type check, QUAL-004
        if: ${{ !cancelled() }}  # each check reports on its own, whatever the one before it did
        run: uv run pyright
      - name: Lint, QUAL-005
        if: ${{ !cancelled() }}  # each check reports on its own, whatever the one before it did
        run: uv run ruff check src tests conftest.py
      - name: Tests
        if: ${{ !cancelled() }}  # each check reports on its own, whatever the one before it did
        run: uv run pytest -q
