# Type check, lint and tests on Linux, macOS and Windows for every change, QUAL-003.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:  # a run started by hand on a branch, as when Actions comes back after a stop

# A newer push to the same branch cancels the older run, so runs for superseded commits do not queue.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120  # a hung leg fails within two hours, not GitHub's six
    permissions:
      contents: read
      pull-requests: read  # the browser tests' path filter reads a pull request's changed files from the API
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The declared minimum, the requires-python lower bound, and the newest released Python, E6.
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      # The browser tests take most of a full run's time, so they run when a change can reach the page they drive:
      # the web module, the MCP Apps views and their build, the test setup and the pinned browser driver, VIEW-012.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            page:
              - 'src/metaform/modules/web/**'
              - 'src/metaform/modules/mcp/**'
              - 'scripts/**'
              - 'conftest.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/checks.yml'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --extra dev
      - name: Browser for the web GUI's checks, VIEW-012
        run: uv run playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MCP Apps map view, built from the web page as the wheel build builds it, MCP-037
        run: |
          npm --prefix scripts ci
          node scripts/build_map_view.mjs
      - name: Type check, QUAL-004
        if: ${{ !cancelled() }}  # each check reports on its own, whatever the one before it did
        run: uv run pyright
      - name: Lint, QUAL-005
        if: ${{ !cancelled() }}  # each check reports on its own, whatever the one before it did
        run: uv run ruff check src tests conftest.py
      - name: Tests
        if: ${{ !cancelled() }}  # each check reports on its own, whatever the one before it did
        env:
          METAFORM_BUILD_VIEWS: '1'  # the map view was built above, so the views' test requires it current
        run: uv run pytest -q
      - name: Browser tests, VIEW-012
        if: ${{ !cancelled() && steps.changes.outputs.page == 'true' }}  # reports on its own, as each check does
        timeout-minutes: 60  # about 25 minutes on four Linux cores; a hang, as Windows had, fails here
        env:
          METAFORM_BUILD_VIEWS: '1'
        run: uv run pytest -q -m browser  # the -m here replaces addopts' -m "not browser"
