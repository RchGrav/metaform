[package]
name = "metaform-web"
version = "0.1.0"
description = "The graph workspace host: serves the built web files and forwards reads to the home's Metaform server."
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "metaform-web"
path = "src/main.rs"

[dependencies]
metaform-server = { path = "../metaform-server" }
axum = "0.8.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "fs"] }
futures-util = "0.3"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

