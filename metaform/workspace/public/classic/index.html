<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metaform · classic map</title>
<link rel="stylesheet" href="/classic/app.css">
<link rel="stylesheet" href="/classic/classic.css">
<script src="/classic/theme.js"></script>
<!-- The 3D map's libraries, each named as its own files import it and found in this page's vendor folder, in the form
     the earlier page's index.html has. -->
<script type="importmap">{"imports": {"three": "/classic/vendor/three.module.min.js", "three/addons/": "/classic/vendor/three-addons/", "three/examples/jsm/": "/classic/vendor/three-addons/", "3d-force-graph": "/classic/vendor/3d-force-graph/dist/3d-force-graph.mjs", "three-forcegraph": "/classic/vendor/three-forcegraph/dist/three-forcegraph.mjs", "d3-force-3d": "/classic/vendor/d3-force-3d/src/index.js", "d3-binarytree": "/classic/vendor/d3-binarytree/src/index.js", "d3-quadtree": "/classic/vendor/d3-quadtree/src/index.js", "d3-octree": "/classic/vendor/d3-octree/src/index.js", "d3-dispatch": "/classic/vendor/d3-dispatch/src/index.js", "d3-timer": "/classic/vendor/d3-timer/src/index.js", "ngraph.graph": "/classic/ngraph.graph.js", "ngraph.forcelayout": "/classic/ngraph.forcelayout.js", "kapsule": "/classic/vendor/kapsule/dist/kapsule.mjs", "lodash-es/debounce.js": "/classic/vendor/lodash-es/debounce.js", "accessor-fn": "/classic/vendor/accessor-fn/dist/accessor-fn.mjs", "d3-array": "/classic/vendor/d3-array/src/index.js", "internmap": "/classic/vendor/internmap/src/index.js", "data-joint": "/classic/vendor/data-joint/dist/data-joint.mjs", "index-array-by": "/classic/vendor/index-array-by/dist/index-array-by.mjs", "d3-scale": "/classic/vendor/d3-scale/src/index.js", "d3-interpolate": "/classic/vendor/d3-interpolate/src/index.js", "d3-color": "/classic/vendor/d3-color/src/index.js", "d3-format": "/classic/vendor/d3-format/src/index.js", "d3-time": "/classic/vendor/d3-time/src/index.js", "d3-time-format": "/classic/vendor/d3-time-format/src/index.js", "d3-scale-chromatic": "/classic/vendor/d3-scale-chromatic/src/index.js", "tinycolor2": "/classic/vendor/tinycolor2/esm/tinycolor.js", "three-render-objects": "/classic/vendor/three-render-objects/dist/three-render-objects.mjs", "polished": "/classic/vendor/polished/dist/polished.esm.js", "@babel/runtime/helpers/esm/extends": "/classic/vendor/@babel/runtime/helpers/esm/extends.js", "@babel/runtime/helpers/esm/assertThisInitialized": "/classic/vendor/@babel/runtime/helpers/esm/assertThisInitialized.js", "@babel/runtime/helpers/esm/inheritsLoose": "/classic/vendor/@babel/runtime/helpers/esm/inheritsLoose.js", "@babel/runtime/helpers/esm/wrapNativeSuper": "/classic/vendor/@babel/runtime/helpers/esm/wrapNativeSuper.js", "@babel/runtime/helpers/esm/taggedTemplateLiteralLoose": "/classic/vendor/@babel/runtime/helpers/esm/taggedTemplateLiteralLoose.js", "@tweenjs/tween.js": "/classic/vendor/@tweenjs/tween.js/dist/tween.esm.js"}}</script>
</head>
<body>
<!-- The earlier Metaform page's two maps, on the new Metaform server. Its parts are the earlier page's own, copied and
     adapted, see app.js; this file keeps the earlier page's ids and classes, so its script and stylesheet apply. -->
<!-- Shown at once while the page loads and lays itself out, `booting` in theme.js; gone when the page is shown. -->
<div id="boot" role="status">Loading the map…</div>
<div class="app">
  <!-- The header: the project on the left, the export, the search, what sets the view, and the way to the new
       workspace. In a narrow window everything in `hmore` folds behind the menu button, `foldHeader`. -->
  <header>
    <div class="brand"><span>meta<b>form</b></span></div>
    <div class="hfield proj"><label for="proj">Project</label><select id="proj"></select></div>
    <div class="hmore">
      <div class="exportpick pick">
        <button class="btn quiet" id="exportBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="exportbox" title="Save the map as a document">Export<i class="i i-chev" aria-hidden="true"></i></button>
        <div class="menu" id="exportbox" hidden role="menu" aria-label="Export">
          <button id="exportMarkdown" type="button" role="menuitem" title="The map as a Markdown document: one section for each element, with what it relies on as sentences">Markdown</button>
          <div class="sep" role="separator"></div>
          <button id="exportMermaid" type="button" role="menuitem" title="The 2D map as a Mermaid flowchart, a .mmd file GitHub, VS Code and Obsidian draw">Mermaid (.mmd)</button>
          <button id="copyMermaid" type="button" role="menuitem" title="The 2D map as Mermaid code, copied to paste into a document or a chat">Copy as Mermaid</button>
        </div>
      </div>
    </div>
    <button class="btn quiet swapbtn" id="swapBtn" type="button" aria-keyshortcuts="S" aria-pressed="false" title="Swap the two maps: the 3D map takes the large area and the 2D map the side column, and back (S)"><span class="lbl">Swap</span></button>
    <button class="btn searchbtn" id="searchBtn" type="button" aria-keyshortcuts="/" aria-controls="search" title="Search the map (/)"><i class="i i-search" aria-hidden="true"></i><span class="lbl">Search the map</span><kbd aria-hidden="true">/</kbd></button>
    <div class="hmore">
    <div class="hfield depthpick" role="group" aria-label="Depth of the map" title="How many levels of the map show, counted along the lines from the top (4 steps through them)">
      <label>Depth</label>
      <button class="btn sm" id="depthLess" type="button" title="One level fewer">Less</button>
      <span class="now" id="depthNow" role="status"></span>
      <button class="btn sm" id="depthMore" type="button" title="One level more">More</button>
    </div>
    <div class="hfield" title="The way the map runs: chosen for the pane, left to right, or top to bottom">
      <label for="directionat">Direction</label>
      <select id="directionat"><option value="auto">Auto</option><option value="across">Across</option><option value="down">Down</option></select>
    </div>
    <div class="layerpick pick">
      <button class="btn" id="layersBtn" type="button" aria-expanded="false" aria-controls="layerlist"><span class="lbl">Layers</span></button>
      <div class="layerlist surface" id="layerlist" hidden role="dialog" aria-label="Layers shown in this view">
        <div id="layers" role="group" aria-label="Layers shown in this view"></div>
        <p class="note" id="note"></p>
      </div>
    </div>
    <div class="settingspick pick">
      <!-- The View menu: how this page draws the map, its colors and its keys. -->
      <button class="btn quiet viewbtn" id="settingsBtn" type="button" aria-label="View settings" aria-expanded="false" aria-controls="settingsbox" title="View settings"><span class="lbl">View</span></button>
      <div class="menu right" id="settingsbox" hidden role="dialog" aria-label="View settings" tabindex="-1">
        <div class="label">Look</div>
        <div class="menu-field themepick"><label for="theme">Colors</label>
          <select id="theme">
            <option value="space">Space</option>
            <option value="black">Black</option><option value="midnight">Midnight</option>
            <option value="graphite">Graphite</option>
            <option value="plum">Plum</option>
            <option value="forest">Forest</option>
            <option value="ember">Ember</option>
            <option value="paper">Paper</option>
            <option value="mist">Mist</option>
          </select>
        </div>
        <div class="menu-field themepick"><label for="textsize">Text size</label>
          <select id="textsize"></select>
        </div>
        <div class="label">Map</div>
        <div class="menu-field themepick" title="The 3D map at the top of the side column, keeping the whole project in view; off, the side column holds the tabs alone"><label for="map3dat">3D map</label>
          <input id="map3dat" type="checkbox" role="switch" checked>
        </div>
        <div class="menu-field themepick" title="The 3D map's names: facing you, or outward from its middle"><label for="signsat">Signs</label>
          <select id="signsat"><option value="facing">Facing</option><option value="outward">Outward</option></select>
        </div>
        <div class="menu-field themepick" title="How far the 3D map's view opens as its pane grows tall (7)"><label for="lensat">Lens</label>
          <select id="lensat" aria-keyshortcuts="7"><option value="natural">Natural</option><option value="wide">Wide</option><option value="fisheye">Fisheye</option></select>
        </div>
        <div class="menu-field themepick" title="What the map says of what the pointer is on: the name where it cannot be read, and a card of its details"><label for="infoat">Info</label>
          <select id="infoat"><option value="name+summary">Name and card</option><option value="name">Name</option><option value="summary">Card</option><option value="off">Off</option></select>
        </div>
        <div class="menu-field themepick" title="Fly the 3D camera to each element selected, framed with its neighbours"><label for="nodezoomat">Node zoom</label>
          <input id="nodezoomat" type="checkbox" role="switch" checked>
        </div>
        <div class="menu-field themepick" title="Which lines the dots flow along: none, those of the part under the pointer, the selection's, or all of them (2)"><label for="flowat">Flow</label>
          <select id="flowat" aria-keyshortcuts="2"><option value="off">Off</option><option value="hover">Under the pointer</option><option value="selected">The selection's</option><option value="all">All lines</option></select>
        </div>
        <div class="sep" role="separator"></div>
        <button id="shortcutsBtn" type="button" title="Every key the map and the page take">Keyboard shortcuts <kbd aria-hidden="true">?</kbd></button>
      </div>
    </div>
    </div>
    <button class="btn quiet helpbtn" id="helpBtn" type="button" aria-label="Help" aria-keyshortcuts="?" aria-controls="help" title="Help: every key the map and the page take (?)"><span class="lbl">Help</span></button>
    <a class="tonew" href="/" title="The new graph workspace">New workspace</a>
    <button class="btn icon quiet" id="moreBtn" type="button" aria-label="More controls" aria-expanded="false" title="More controls"><i class="i i-menu" aria-hidden="true"></i></button>
  </header>

  <aside>
    <!-- The small area: the map that keeps the whole in view over the tabs. The page opens with the 3D map here and
         the 2D map in the large area, `openSwapped`; Swap exchanges them. -->
    <div class="small" id="small">
    <div class="map2d" id="map2d" tabindex="0" aria-label="The whole map. Down goes deeper, Up back to the parent, Left and Right across; Enter goes inside, Escape lets go of the selection, then out; Alt with Left or Right goes back or forward through the nodes selected; the wheel zooms at the pointer, 0 fits the whole map, S swaps the two maps. Press ? for every key.">
      <nav class="crumbs" id="crumbs" hidden aria-label="Where you are inside the map"></nav>
      <div class="viewport" id="viewport"></div>
    </div>
    </div>
    <div class="splitter split" id="smallSplit" role="separator" aria-orientation="horizontal"
         aria-label="The split between the small map and the panes" title="Drag to resize; double-click to reset"></div>
    <div class="tabs" role="tablist" aria-label="The selected object">
      <button role="tab" id="t-object" type="button" aria-selected="true" aria-controls="p-object">Object</button>
      <button role="tab" id="t-brief" type="button" aria-selected="false" aria-controls="p-brief" tabindex="-1" title="What an agent reads about the selected element">Brief</button>
      <button role="tab" id="t-prov" type="button" aria-selected="false" aria-controls="p-prov" tabindex="-1" title="Where the selected element comes from: its source reference, its sources and its reviews">Provenance</button>
    </div>
    <section class="pane" id="p-object" role="tabpanel" aria-labelledby="t-object" tabindex="-1"><p class="loading">Reading the map…</p></section>
    <!-- The element's brief: the answer an agent is handed when it goes to the element's address, with its size. -->
    <section class="pane" id="p-brief" role="tabpanel" aria-labelledby="t-brief" hidden></section>
    <section class="pane" id="p-prov" role="tabpanel" aria-labelledby="t-prov" hidden></section>
  </aside>

  <main>
    <div id="big3d">
    <div class="view3d">
    <div id="stage" aria-label="3D map of the project" tabindex="0"></div>
    <div class="tip3d" id="tip3d" hidden></div>
    <div class="legend" id="legend"></div>
    <div class="count" id="count"></div>
    </div>
    </div>
  </main>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<div id="menu" class="menu" hidden role="menu" aria-label="What can be done with this element"></div>
<!-- The page's own dialogs: a confirmation, the search of the map, and the keyboard shortcuts. -->
<div id="confirm" class="window dialog" hidden role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="body"></div>
</div>
<div id="search" class="window dialog search" hidden role="dialog" aria-modal="true" aria-label="Search the map">
  <div class="searchbar"><i class="i i-search" aria-hidden="true"></i>
    <input class="query" type="search" role="combobox" aria-expanded="true" aria-controls="searchResults" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Search parts, what they rely on and what the layers hold" aria-label="Search the map">
    <kbd aria-hidden="true">Esc</kbd></div>
  <div class="results" id="searchResults" role="listbox" aria-label="Results"></div>
  <div class="searchfoot"><span><kbd>↑</kbd><kbd>↓</kbd> choose</span><span><kbd>Enter</kbd> go to it</span><span><kbd>Esc</kbd> close</span></div>
</div>
<div id="help" class="window dialog wide" hidden role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
  <div class="bar"><span class="title">Keyboard shortcuts</span><button class="close btn icon sm quiet" type="button" aria-label="Close" title="Close (Escape)"><i class="i i-close" aria-hidden="true"></i></button></div>
  <div class="body">
    <!-- Drawn from the page's one key table, KEYS in keys/keys.js, which the keys run from too. -->
    <div class="tabs helptabs" role="tablist" aria-label="Kinds of keys"></div>
    <input class="keyfind" type="search" placeholder="Find a key by what it does" aria-label="Find a key by what it does" autocomplete="off">
    <div class="keys"></div>
  </div>
</div>
<div id="draw" aria-hidden="true"></div>
<script src="/classic/vendor/mermaid.min.js"></script>
<script type="module" src="/classic/app.js"></script>
</body>
</html>
